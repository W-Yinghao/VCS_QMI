[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vcs-ssl-pilot"
version = "0.1.0"
description = "VCS-QMI CIFAR-10 SSL pilot: server integration of the collaborator reference objective"
requires-python = ">=3.10"
dependencies = ["torch", "torchvision", "numpy", "pyyaml", "pillow"]

[tool.setuptools]
packages = ["vcs_ssl", "vcs_ssl.data", "vcs_ssl.models", "reference"]

[tool.setuptools.package-dir]
vcs_ssl = "src/vcs_ssl"
"vcs_ssl.data" = "src/vcs_ssl/data"
"vcs_ssl.models" = "src/vcs_ssl/models"
reference = "reference"
