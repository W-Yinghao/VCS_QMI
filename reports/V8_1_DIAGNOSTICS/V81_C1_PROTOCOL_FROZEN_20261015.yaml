primary_readout:
  data: DEV (3,257 images, 307 prompts), predictions from each unit's best.pt export (images_DEV.jsonl, raw mu)
  contrast: C1 unit minus the original full-adaptation V8-FIT unit of the same arm and seed; seed mean of the three per-seed differences (no prediction ensemble)
  metrics:
    a_pair_accuracy: pooled within-prompt pair accuracy over all pairs whose exact human means differ (vote sums compared exactly), model ties 0.5
    b_selected_human_mean: per prompt the image with the highest raw mu (ties -> lowest candidate index; candidates in lexical image-id order, as V81_02), its human
      mean, averaged over prompts
  uncertainty: prompt_group cluster bootstrap (V7 near-duplicate component), 2,000 replicates, seed 2718, one resample per replicate shared by all arms / seeds /
    variants; percentile 95 % interval of the seed-mean difference
  decision: improves = interval lower bound > 0 for at least 2 of the 3 arms on (a), or for at least 2 of the 3 arms on (b); otherwise 'does not improve'
  code: 'scripts/v81/c1_analyze.py (self-check with V8 on both sides: every difference exactly 0, job 1042289)'
secondary_readouts:
- DEV pooled Spearman difference (same bootstrap)
- prompt-macro mean-rating MSE and its decomposition (prompt bias^2 + within-prompt centred error)
- RPS / CE
- CAL_SELECT curves per epoch (logs)
- FIT-AUDIT best vs resume (C1 audit vs V81_05 D05 rows)
- 'cost: s/step, epoch times, peak memory, GPU type'
stop_rule: 'if the pre-registered primary rule does not return ''improves'', V8 is closed out: no distillation, residual, backbone or tuning rescue of this branch,
  no further C variant without a new owner decision'
exposure: DEV was read by V8.1 D02-D04; the C1 DEV readout is a development comparison.  The V8-05 confirmation prompts are not used to choose or evaluate C1 and
  do not become a C1 confirmation set.
