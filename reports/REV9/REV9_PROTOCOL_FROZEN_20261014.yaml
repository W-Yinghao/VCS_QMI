# REV9 — paired phase-B interventions on the frozen D1 selectors.  FROZEN 2026-10-14 before any REV9 run (owner go-ahead below).
rev9:
  go_ahead: >
    Owner, 2026-10-14 ("1和2都做，GPU别空着"), answering the coordinator's list after REV8 (reports/REV8/REV8_DIAG_REPORT_20261014.md): item 1 =
    "a paired retraining (e.g. phase B in eval mode, or hard-mask evaluation during gate training) would test whether REV8's candidate
    contributors cause the D1 shortfall".  Frozen REV8 limits: REV8 is critic-only; causation needs this paired intervention.
  question: >
    Do the two phase-B mechanisms REV8 measured change what the D1 selectors deliver?  (R8-01) dropout perturbs the gate's inputs during phase B
    (train-vs-eval top-k Jaccard 0.62-0.67 for VCS); (R8-02) the logged soft-hard gap is relaxation, material at phase-A lr 3e-4.
  units: >
    LLaVA 10k (outputs/R7_D1) frozen units at their CAL-chosen learning rates: vcs_lr0.0003, logistic_lr0.0001, direct_lr0.0001 x seeds 0-2
    (9 units).  Qwen / FULL scales are not in this round.
  design: >
    Each new unit starts from the frozen unit's end-of-phase-A state (<tag>.resume.pt: estimator, optimiser, RNG), so phase B sees the same
    estimator, question batches, budgets and Gumbel draws; only the phase-B loss changes (scripts/rev9_phaseb.py; frozen modules imported, not
    edited).  I0 = unmodified rerun (guard, seed 0 of each objective: 3 units); I1 = critic in eval mode in phase B; I2 = I1 + straight-through hard
    top-k (forward = deployed hard top-k of the gate logits, gradient = the frozen relaxed top-k).  18 intervention units.
  guard: "I0: estimator identical to the frozen unit (max abs diff 0) and gate within 1e-3 (GPU nondeterminism); a failed guard stops the readout of that objective"
  evaluation: >
    The frozen D1-30 evaluator (scripts/r7_d1_30_run.py, LLaVA-1.5-7B host, SparseVLM env, H100 / L40S) on GQA DEV, TextVQA val and ChartQA val at
    the fixed budgets 72 / 144 / 288 / 432 (12.5 / 25 / 50 / 75 %), selector rows only; the frozen units' D1-30 predictions are the paired baseline.
    No latency matching (same architecture and budget -> same cost); no dynamic rows; no official test.
  primary: >
    Per objective and budget, accuracy(I1) - accuracy(frozen) and accuracy(I2) - accuracy(frozen) on each benchmark, mean over seeds of the
    per-seed paired differences; image-grouped paired bootstrap 2,000 (seed 0); Holm over the 2 interventions x 4 budgets x 3 benchmarks within
    each objective.  Secondary: the REV8 critic diagnostics (soft-hard gap, gate Jaccard) re-read on the new units; I2 - I1.
  reading_limits: "LLaVA 10k only; a positive effect is a mechanism finding for this scale, not a claim that the selector beats SparseVLM or the grid"
  outputs: "outputs/REV9/selectors (units), outputs/REV9/d1_30/pred; results-only commit to reports/REV9/REV9_RESULTS/, then a report"
addendum_full_20261014: >
  Dated addendum before any REV9 run (owner 2026-10-14: keep the GPUs busy; same design): REV9-FULL repeats the paired phase-B interventions on
  the 9 frozen D1-FULL units (outputs/R7_D1_FULL: vcs / logistic / direct, all at their CAL-chosen lr 1e-4, seeds 0-2; I0 on seed 0 of each).
  Same I0 / I1 / I2, same guard, same frozen D1-30 evaluator and fixed budgets on GQA DEV / TextVQA val / ChartQA val with the D1-FULL PCA, the
  frozen D1-FULL units' D1-30 predictions as the paired baseline; its own Holm family per objective; outputs/REV9_FULL.
execution_note_1_20261014: >
  Job 1039622 (rev9_phaseb) failed at the start of every unit with "RNG state must be a torch.ByteTensor": the frozen resume path
  (scripts/r7_d1_selectors.py train) loads <tag>.resume.pt with map_location = the training device, which moves the saved RNG ByteTensors onto
  the GPU, and the RNG setters need CPU ByteTensors (the frozen D1 runs never resumed on a GPU, so the path was untested there).  Fix in the
  REV9 wrapper only (scripts/rev9_phaseb.py, _set_rng_state_cpu): the tensors are moved back to the CPU unchanged before the frozen setter runs,
  so the restored RNG state is bit-identical and the pairing is kept; the frozen D1 module is not edited.  No unit had trained (each failed at
  the load), so nothing was read.  Resubmission: slurm/rev9_phaseb_gated.sbatch (job 1040359; same partition / time as 1039622) runs the I0 guard
  on vcs_lr0.0003_s0 into outputs/REV9_SMOKE_resume first and continues to the frozen 'phaseb' mode only if the frozen guard holds
  (estimator diff 0, gate within 1e-3); evaluations 1040360-63 (afterok).  REV9-FULL (rev9f_phaseb 1039944, which imports the same wrapper)
  is held back with Nice 800 until that guard passes.
