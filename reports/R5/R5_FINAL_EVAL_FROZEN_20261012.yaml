  D1_refcocog_source: "default accepted: synthetic tests + the DEV-content REFER smoke + the checks at the single opening (DEV records re-derived from the same refs(umd).p must equal the DEV meta, recorded split counts, archive hash / member identity)"
  D2_test_file_hashes: "hashed before parsing (above) and again by build at the single opening; any difference stops build"
  D3_fused_rows: "default: only the 45 fused rows that have a CAL-selected λ (R5-10 F1); the missing cells are listed as not evaluated; no new CAL selection before the read"
  D4_primary_decision: >
    VQ − VCS per split on the primary metric (query-level Acc@0.5 over every official expression).  Seed-paired two-sided t (df 2) with Holm over
    the 5 splits at α 0.05, as implemented.  Reading rule (the project's two-interval rule, applied when reporting): "VQ improves / lowers VCS on
    <split> by x" only when the Holm-adjusted seed-t test rejects AND the image-cluster bootstrap 95 % interval excludes 0 with the same sign;
    otherwise "no detectable difference at the family-wise level" (no equivalence claim).
  estimation_not_testing: "VQ − D, VQ − E, VQ − JQ: effect sizes with both 95 % intervals; no non-inferiority margin (owner decision T2)"
  D5_bootstrap: "B = 1,000 image-cluster resamples, as in the r5 reports (script constant BOOT_B; the verified code is not changed)"
  D6_detector_gpu: "RTX6000PRO pinned, the GPU type of the stored DEV proposals (L40S regeneration matches 98.1 % of boxes at IoU >= 0.99 but is not bit-identical)"
  D7_rank_jobs: "3 (one per dataset)"
  D8_scores_kept: "top box per expression only; no sealed score matrices (nothing can be re-ranked after the read)"
  D9_iou: "continuous coordinates, as on DEV"
  D10_results: "results in <root>/score; copied into reports/R5 by a results-only commit after scoring"
  D11_licences_and_ledger: >
    licences checked and documented per item in the D5 register (reports/DATA_LICENCE_REGISTER_20261012.md, f231439): V1 RefCOCOg (attribution /
