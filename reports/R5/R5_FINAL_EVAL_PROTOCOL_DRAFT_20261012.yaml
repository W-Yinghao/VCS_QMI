candidate_generator:
  detector: VL1-21 clean Faster R-CNN R50-FPN (models/vl1_21_detector/final.pt, sha256 7df2fa15...147b = reports/R4/intake_hashes.json)
  settings: torchvision defaults of scripts/vl1_21_detector.py (score >= 0.05, per-class NMS, top-100), fp16 autocast, batches of 8 over the split's images sorted by image id
  candidates: top-100 in detector order, clipped to the image, < 1 px dropped (scripts/r4_vl1_finetune.py build); no proposal -> the query is an error
  gpu: RTX6000PRO (the GPU type of the reported DEV / CAL proposals, job 1033362)            # open decision D6
  measured_sensitivity: >
    same GPU type -> bit-identical (two L40S smokes, identical proposals and prediction manifests); L40S vs the stored RTX PRO 6000 DEV proposals
    with the same batches: 0 / 40 images bit-identical, 97.5 % of boxes matched at IoU >= 0.99, top-1 box equal on 97.5 % of images; a different
    batch composition (padding): 83 % of boxes matched, top-1 equal on 67.5 % of images.  The frozen order (sorted ids, batches of 8) defines the
    proposals of each split.

metrics:
  primary: query-level Acc@0.5 over ALL official expressions of the split; IoU of the top-1 box with the annotated box (xywh -> xyxy, continuous coordinates, >= 0.5); no proposal / no valid proposal = error
  development_table: image-macro Acc@0.5 on images with >= 2 (non-degenerate) referred objects — the DEV definition, own table
  subset_table: query-level Acc@0.5 on the >= 2-referred-objects subset, own table
  context_only: proposal ceiling (queries with >= 1 proposal at IoU >= 0.5), queries without any proposal
statistics:
  primary_confirmation: VQ - VCS on the primary metric per split (5 splits), paired by seed (0-2); seed-paired two-sided t test (df 2); Holm over the 5 splits at alpha 0.05   # open decision D4
  decision_wording: "Holm-rejected and mean > 0 -> 'VQ improves VCS on <split> by x'; Holm-rejected and mean < 0 -> 'VQ lowers VCS by x'; not rejected -> 'no detectable difference at the family-wise level' (no equivalence claim)"
  estimation_not_testing: [VQ - D, VQ - E, VQ - JQ]   # effect sizes with 95 % intervals; NO non-inferiority margin (owner decision 2026-10-12)
  secondary_descriptive: [VNU - E, VCS+F - E+F (each with its own lambda_CAL), VNU - JNU, VCS - E, D - E]
  intervals: seed-paired 95 % t (df = n - 1) AND a 95 % percentile image-cluster bootstrap (B = 1000, images resampled with all their expressions, seed-averaged per-image differences, one index matrix per split shared by every row and contrast, numpy SeedSequence([20261012, 77, split index])) — as the r5 reports
  every_metric_gets_every_contrast: true (only the primary metric carries the Holm decision)
  pooling_over_datasets: none (descriptive only, outside the script); testA / testB share checkpoints (Holm is valid under dependence)
  interval_reading: '"contains 0" is containment, never equivalence'

execution:                                    # one fixed script; stages file-gated by slurm/r5_final_eval_submit.sh (login node, nohup setsid; stop by PID)
  root: /home/infres/yinwang/CS_QMI/outputs/R5_FINAL   # sealed/labels (0700 / 0400), sealed/predictions (0444), inputs/, proposals/, logs/, score/
  launch: 'mkdir -p /home/infres/yinwang/CS_QMI/outputs/R5_FINAL && cd /home/infres/yinwang/CS_QMI/ssl_pilot && PLAN_SRC=<frozen plan json> CAP=27 nohup setsid bash slurm/r5_final_eval_submit.sh /home/infres/yinwang/CS_QMI/outputs/R5_FINAL >> /home/infres/yinwang/CS_QMI/outputs/R5_FINAL/driver.log 2>&1 < /dev/null &'
  stages:
    - build (CPU): opens refs(umd).p + instances.json and the four MDETR test files ONCE (each attempt logged in logs/build_attempts.log); writes inputs without labels and the sealed labels (GT box per query, >= 2 flag per image); logs counts and sha256 only.  Stops BEFORE writing anything if a count differs from the recorded split size, an image is missing, the archive hash / member identity fails, or (RefCOCOg) the DEV records re-derived from the same refs(umd).p differ from the R4-VL0 DEV meta (6 442 expressions)
    - proposals (GPU, RTX6000PRO): detector on each split's images
    - rank (GPU, 3 shards = dataset): verifies every checkpoint sha256 and its CAL epoch / critic slope against the plan; top-1 box per query for every row -> sealed/predictions/pred__<model>__<split>.json (single writer, atomic)
    - manifest (CPU): completeness (every row, every query) + sha256 of every prediction file (MANIFEST.sha256, manifest.json); refuses if the script changed between stages
    - STOP: the driver waits for <root>/ALLOW_SCORING
    - coordinator: commit sealed/predictions/MANIFEST.sha256 + manifest.json (+ logs/*.json), then write 'manifest_sha256=<sha256 of MANIFEST.sha256>' and the commit id into <root>/ALLOW_SCORING
    - score (CPU): the only step that opens the labels; verifies the gate's manifest hash and every prediction file; writes score/results.json and score/tables.md
  driver_rules: [submit only while my normal-QOS jobs < CAP - 1 (CAP 27), stop on an empty job id, NFS settle 180 s before declaring a unit lost, retry proposals / rank / manifest up to 3 times, NEVER auto-retry build or score (they open the sources / labels), stop on exit=3 (a deliberate check failure) or exit=0 without marker]
policies:                                     # owner decision 七 / T1: implementation-error fixes, re-verification of frozen predictions and re-selection are kept apart
  no_post_test_tuning: true                   # no model, checkpoint, lambda, metric, row or wording is chosen from test results; every pre-declared row is reported
  implementation_error_correction: >
    Only implementation errors (e.g. a parser or I/O fault) may be fixed after the first read.  Each fix: a new commit with the reason, the affected
    stages re-run into a NEW root (R5_FINAL_fix<n>) with the SAME frozen plan, all attempts and both results published; never a change of rows,
    checkpoints, lambda, metrics or statistics.
  re_verification: >
    Deterministic re-checks of the frozen predictions are allowed at any time and are not a new read: `score --out <root>/score_reverify_<n>`
    re-scores the committed, hash-verified prediction files (the default score directory refuses a second scoring).
  re_selection: forbidden.  A new method, a new checkpoint choice or a new lambda needs a new protocol AND a still-unread test set (none is left for RefCOCO*).
  failed_build_before_labels: a build stopped by a check writes nothing; a corrected rerun is an implementation-error fix (logged), labels unused
