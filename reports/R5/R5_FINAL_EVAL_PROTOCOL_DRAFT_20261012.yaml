  VCS: {source: 'R4-VL1 (RefCOCOg / RefCOCO+), R5-X1 (RefCOCO)', dir: models/r4_vl1, law: uniform nu, rank: cosine}
  JS: {source: R4-VL1 / R5-X1 matched JS, dir: models/r4_vl1, rank: cosine}
  E: {source: R4-VL1 / R5-X1 set-event softmax, dir: models/r4_vl1, rank: cosine}
  VNU: {source: 'R4-VL2 VCS(nu), RefCOCOg / RefCOCO+ only', dir: models/r4_vl2, rank: 'native 2 a cos + log s (lambda = 1)'}
  JNU: {source: 'R4-VL2 JS(nu), RefCOCOg / RefCOCO+ only', dir: models/r4_vl2, rank: native}
  D: {source: 'R5-30 (RefCOCOg / RefCOCO+), R5-QX1 (RefCOCO) distribution softmax', dir: models/r5_dist, rank: cosine}
  VQ: {source: 'R5-QN (RefCOCOg / RefCOCO+), R5-QX1 (RefCOCO) VCS with the query-normalized critic', dir: models/r5_qnorm, rank: 'cosine (normalizer constant per query)'}
  JQ: {source: R5-QN / R5-QX1 JS with the query-normalized critic, dir: models/r5_qnorm, rank: cosine}
  fused_rows: {rule: "R5-10 F1: 2 a cos + lambda_CAL log s_r, lambda in {0, 0.25, 0.5, 1, 2, 4} chosen on CAL image-macro Acc@0.5, ties smallest", rows: "VCS+F, JS+F, E+F (test_time_fusion), VNU+F, JNU+F (native when lambda_CAL = 1, else posthoc_task_calibration)", datasets: [refcocog, refcocoplus]}
