# Written by the implementation agent.  NOTHING in this file or in its development runs opened, listed, hashed or loaded an official test
# annotation file (RefCOCOg test, RefCOCO / RefCOCO+ testA / testB) or anything under a closed/ directory.  Development used only the MDETR
# *train* files, the R4-VL0 DEV meta, the stored VL1-21 DEV proposals and a REFER-format file holding RefCOCOg DEV content only.
# To freeze: set status: frozen, fill final_code_commit, resolve open_decisions (each has a default), commit this file with the code and the plan
# (reports/R5/R5_FINAL_EVAL_PLAN_DRAFT_20261012.json, renamed if wanted), then launch (execution below).  Rows are listed at the end (generated
# from the plan by `r5_final_eval.py rows-yaml`; checkpoint and detector sha256 computed 2026-10-12 by CPU jobs 1035743 / 1035765).
