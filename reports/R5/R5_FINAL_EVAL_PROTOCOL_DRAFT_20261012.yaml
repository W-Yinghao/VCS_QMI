  build_cpu: 11 s for three DEV sets (48 MB MDETR train files); test estimate 2-4 min (adds the 1.08 GB MDETR archive and the 57 MB refcocog.zip for the member checks)
  proposals_gpu: 28-31 images/s; 5 588 DEV images in 199 s incl. model load (job 1035767)
  rank_gpu: 1 300-1 380 crops/s per checkpoint (SigLIP 2 B/16, bf16) + about 5 s per checkpoint for the sha256 check and loading; e.g. 86 206 crops (RefCOCO DEV, 1 699 images) in 62 s (jobs 1035779-1035781)
  integrity_run_total: 2 260 GPU-seconds (0.63 GPU-hours) for 33 checkpoints x DEV
  development_gpu_spent: about 0.75 GPU-hours (three 40-image smokes + the integrity run); the RTX-only detector bit-identity check was cancelled before it started
gpu_budget_test_run:                          # L40S estimate from the measured rates; RTX PRO 6000 / H100 are faster
  proposals: 5 600 images, about 4 min
  rank_refcocog_test: 24 checkpoints x about 119 k crops (2 600 images x 45.8 proposals) -> about 40 min
  rank_refcocoplus_testA_testB: 24 checkpoints x about 78 k crops -> about 26 min
  rank_refcoco_testA_testB: 18 checkpoints x about 76 k crops -> about 19 min
  total: about 1.5 GPU-hours (three rank jobs in parallel, about 40 min wall-clock once GPUs are free); cap 3 GPU-hours including one retry
  cpu: build + manifest + score under 10 CPU-minutes
  queue_slots: at most 3 GPU jobs + 1 CPU job at a time (CAP 27 rule respected by the driver)

open_decisions:                               # each has a default (the plan as committed); the coordinator / owner settles them before the freeze
  D1_refcocog_source:
    question: RefCOCOg test is read from refs(umd).p (REFER release; all splits in one pickle), the only source with the raw text the models were trained on.  Its parser could not be smoke-tested on the real file without loading the test split.
    default: accept — the parser mirrors src/vcs_vl/refcocog.py load_scenes (which parsed this file in every R4 / r5 run), is unit-tested on synthetic REFER files and smoke / integrity-tested on a REFER-format file with RefCOCOg DEV content; at the single opening the build re-derives the DEV records from the same file and must match the R4-VL0 DEV meta (6 442 expressions), the recorded counts (2600 / 5023 / 9602 / 1580) and the archive hash (refcocog.zip) before any input or label is written
    alternatives: [MDETR finetune_refcocog_test.json (format tested on the train file, but sent-form captions != training text: a protocol deviation)]
  D2_test_file_hashes:
    question: no per-file sha256 of any RefCOCO-family test file was recorded before; the files were never moved to a closed/ directory.
    default: hash at the single opening (build logs the sha256 of every parsed file, checks archive member identity and the recorded archive hashes 3d1f7e5b... / ed7bf625...)
    alternative: a hash-only CPU job before the freeze (it would open the test files before the freeze; the coordinator's call)
  D3_fused_rows_scope:
    question: lambda_CAL exists only for VCS / JS / E (R4-VL1) and VCS(nu) / JS(nu) (R4-VL2) on RefCOCOg and RefCOCO+ (R5-10 F1).
    default: fused rows only where lambda_CAL exists (45 rows); the 36 checkpoint cells without lambda_CAL (63 fused rows) are listed, never filled
    alternative: run the F1 CAL rule for VQ / JQ / D (all datasets) and VCS / JS / E on RefCOCO before the freeze (new CAL scoring, about 0.5–1 GPU-hour; the existing CAL tools load the full annotation files)
  D4_primary_test:
    default: seed-paired two-sided t test per split (df 2), Holm over the 5 splits at alpha 0.05, primary metric only; testA / testB of one dataset share checkpoints (Holm holds under dependence)
    alternatives: [one-sided (H1 VQ > VCS), Holm over 3 datasets with testA / testB pooled per dataset, a bootstrap p-value]
  D5_bootstrap: {default: B = 1000 image-cluster percentile bootstrap (as the r5 reports), alternative: B = 10000}
  D6_detector_gpu:
    default: proposals on RTX6000PRO (the GPU type of the reported DEV / CAL proposals); the job may wait for a slot (RTX nodes 58 / 59 / 61; node60 excluded; sbatch --test-only at 12:58 UTC estimated the first RTX start at 2026-10-13 00:02 because the r7 D1-20 units hold every RTX card for up to 12 h)
    alternative: any of RTX6000PRO / H100 / L40S (measured cross-type effect small but not zero; same-type reruns bit-identical; an RTX-vs-stored bit-identity check was cancelled to spare the GPU quota)
  D7_rank_shards: {default: '3 rank jobs (one per dataset, about 0.5-1 h each)', alternative: '11 jobs (dataset x checkpoint directory; plan --shard-by family)'}
  D8_keep_cosines: {default: 'only the top-1 box per query and row is kept (no score matrices, so no post-hoc re-ranking is possible)', alternative: 'also keep sealed cosine matrices for audits'}
  D9_metric_conventions: {default: 'continuous-coordinate IoU (as the DEV evaluation and MDETR), IoU >= 0.5 counts, ground truth = the annotated box unclipped, prediction = the clipped proposal', alternative: 'the +1-pixel IoU of some REFER evaluators (not used anywhere in this project)'}
  D10_results_location: {default: results stay in <root>/score until the coordinator copies results.json / tables.md into reports/R5 and writes the report}
  D11_licences_and_ledger: {required: 'owner records the D5 basis for V1 / V2 / V3 / V17 and the ledger note (R4-02 §6.1) before the read; then set licenses_checked / all_controls_declared_before_reading / algorithms_frozen in the proposal'}

