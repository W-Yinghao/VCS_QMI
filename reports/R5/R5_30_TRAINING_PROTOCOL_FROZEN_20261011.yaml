# R5-30 — distribution softmax, full two-tower fine-tuning (6 runs).  FROZEN before any R5-30 result (code, tests and a subset smoke only).
protocol_id: R5-30
status: frozen
base_commit: 2bd405af4279ddbe7a28e6062cf740be281e037a
code_commit: 2231130            # distribution_softmax loss, trainer objective, tests
parent_protocol: reports/R4/R4_VL_TRAINING_PROTOCOL_FROZEN_20261011.yaml   # R4-VL1 option A
package: r5/package_r5_20261011 (docs/03 §2.3, §8; docs/05 §2–3; machine/proposed_training_runs.json)
research_question: >
  Does the requirement to fit a uniform distribution over all valid proposals account for some of the gap between the pairwise estimators
  (VCS / matched JS) and set-event softmax on detector proposals?
claim_type: exploratory_hypothesis
loss_identity_type: standard_algebra_not_new_method       # L_D − L_E = log k + KL(U_A ‖ ρ_A) (D2); identical for k = 1
objectives:
  new: [distribution_softmax]                              # −Σ p log softmax_r(2f), all real proposals in the denominator
  reused: [vcs_uniform, js_uniform, set_softmax]           # R4-VL1, 18 runs, unchanged
models:
  name: siglip2_b16
  initialize_from: original_pretrained                     # not from any R4 checkpoint
  weight_hash: see reports/R5/r5_hashes.json (siglip2_b16_weights)
  both_towers_trainable: true
  frozen_feature_probe: false
data:
  datasets: [refcocog, refcocoplus]
  independent_unit: image
  roles_hash: see reports/R5/r5_hashes.json (datasets.*.roles_sha256)
  proposals_hash: see reports/R5/r5_hashes.json (datasets.*.proposals_sha256)
  inherited_eligibility: R4-VL1 (>= 2 referred objects, path, >= 1 proposal; FIT keeps valid queries, drops images without any, counted)
  target: uniform_over_IoU_ge_0.5_proposals_per_covered_query
  normalization: uniform_covered_queries_then_uniform_images
  denominator: all_real_proposals_including_never_positive_regions
  no_valid_query_training: exclude_and_count
  uncovered_query_evaluation: count_as_error
optimization:                    # read from scripts/r4_vl1_finetune.py, not from comments
  epochs: 10
  batch_images: 32
  encoder_lr: 1.0e-5
  weight_decay: 0.05
  warmup_steps: 200
  schedule: inherit_actual_R4_VL1 (linear warm-up, cosine)
  gain_init: 10.0
  bias_init: -2.5
  softmax_logits: 2f
  critic_parameter_groups: inherit_actual_code (critic a, b in their own AdamW group at CRITIC_LR, no weight decay)
  symmetric_new_search: none
  chunking: exact_image_weighted_accumulation (384 crops; 160 below 60 GiB; expandable segments)
  run_command: VL_DATASET=<d> scripts/r4_vl1_finetune.py --backbone siglip2_b16 --objective distribution_softmax --seed <s> --chunk-crops 384
seeds: [0, 1, 2]                 # all three run; no screening on seed 0
selection:
  role: CAL
  metric: all_proposal_image_macro_Acc_IoU_0.5
  ties: earliest_epoch
  per_epoch_DEV_selection: false
  DEV: step 0 (gate, given-box within 0.3 of the frozen raw value) and once at the selected epoch from the exact fp32 copy
primary_contrast: distribution_softmax_minus_set_softmax (paired by seed, t df 2, per dataset)
secondary_contrasts: [vcs_minus_distribution_softmax, js_minus_distribution_softmax]
secondary_metrics: [Acc_IoU_0.75, query_accuracy, given_box_accuracy, common_risk, multiplicity_strata (R5-20B), legal-set probability and KL]
statistics:
  seed_pairing: true
  n_seed: 3
  main_interval: paired_t_df2_per_dataset
  multiplicity: two datasets reported separately; no pooling into a claim; no selection of the favourable dataset
  image_bootstrap: conditional_on_trained_models (shared image indices)
  diagnostic_status: exploratory_DEV_reused
  pooled_dataset_mean: descriptive_only
  wording: "an interval containing 0 is reported as containing 0 (no equivalence claim without a margin fixed in advance)"
