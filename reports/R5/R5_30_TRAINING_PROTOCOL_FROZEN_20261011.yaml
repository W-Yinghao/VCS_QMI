  fp32_reload: inherited (exact fp32 snapshot for DEV; fp16 checkpoint; scorer re-check)
  full_tower_smoke: job 1034130 passed (RefCOCOg seed 0, 64 / 48 / 48-image subsets, L40S, chunk 160; end-to-end code path; 44.1 % on the subset is not a result)
