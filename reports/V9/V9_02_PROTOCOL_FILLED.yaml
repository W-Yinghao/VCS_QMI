  host: "SGR single model, SGRAF python3.6 branch a19d1a9 (HOST_LOCK.yaml); NCR / L2RM wrap the same modules"
  full_feature_pipeline_training: true
  raw_visual_backbone_end_to_end: false
  main_noise: [0.0, 0.4]
  formal_seeds: [901, 902, 903]
  tuning_seed: 917
  main_methods: [Unweighted_A, NCR_A, L2RM_A, VCS_Weight, BCE_Weight, RuLSIF_Weight, Nystrom_Weight, RankMass]
  main_critic: "tanh(a*cos+b), a = softplus(a_raw) > 0"
  weight_update: fixed_before_student_training
  loss_scaling: "dataset-global constant: L = (sum_A ell_i + sum_U w_i ell_i) / (n_A + sum_U w_i), denominator fixed before training (package §05 §5)"
  host_native_hyperparameters: "HOST_LOCK.yaml (batch 128, Adam 2e-4, decay x0.1 at lr_update, margin 0.2, hardest in-batch negative, f30k 40 ep / coco 20 ep)"
  n1_rho: [0.0, 0.1, 0.3, 0.5]
  n1_batch_size: [128, 512, 2048]
  reference_corruption_primary: 0.0
  additional_corruption: stress_only_not_theory_guaranteed
  n1_repeats_finite: 200
  n1_repeats_image: 30
  n1_image_source_exploration: "/home/infres/yinwang/CS_QMI/outputs/P49_precheck_A (COCO train2017 CLIP ViT-B/32 laion2b features; SRC-FIT 20,000 / SRC-CAL 5,000 / SRC-EVAL 5,000 images, 5 captions each; already observed by P49/P57/P71/P79/P159 — exploration only, not a new confirmation)"
