  conditional_second_dataset: EPFL_RGB_NIR    # /projects/EEG-foundation-model/yinghao/data/epfl_rgb_nir; terms unresolved -> no new training (package §06 §2)
  fit_fraction: [0.25, 1.0]
  train_mismatch: [0.0, 0.2]
  methods: [VCS, BCE, InfoNCE, CoMIR]
  seeds: [901, 902, 903]
  test_occlusion: separate_protocol_not_initial
  reuse_matching_clean_checkpoints: true       # R6 REG-P1/P2 units (ssl_pilot reports/R6/R6_REG_P{1,2}_PROTOCOL_FROZEN_*.yaml; outputs under /home/infres/yinwang/CS_QMI/outputs/R6_*) only if data / code / seed hashes match — fork C decides per unit
statistics:
