        - {section: ["training (native SGR, train.py)", optimizer], quote: "Adam(lr=2e-4)", token: "Adam"}
      schedule.learning_rate:
        - {section: [locked_recipes, common_student_B_table], quote: "Adam lr 2e-4", token: "2e-4"}
        - {section: ["training (native SGR, train.py)", optimizer], quote: "Adam(lr=2e-4)", token: "2e-4"}
      schedule.margin:
        - {section: [locked_recipes, common_student_B_table], quote: "margin 0.2", token: "0.2"}
        - {section: ["training (native SGR, train.py)", native_margin], quote: "native_margin: 0.2", token: "0.2"}
      schedule.grad_clip:
