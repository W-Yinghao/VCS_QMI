question: >
  With fewer aligned training images (25 % of REG-P1's FIT) or with 20 % of the positive training correspondences displaced, does the learned
  local-relation energy trained with VCS still recover known rigid transforms as reliably as the per-image MI / NMI, the same-target kernel critic
  and CoMIR representations under REG-P2's shared optimiser — and how does each method's success change from clean to mismatched supervision?
  Not assumed: that a bounded objective is robust to noisy supervision (docs/06 §1).
data:
  source: BF/SHG TMA cores, Zenodo 4550300 (CC BY 4.0), train / validation1 / validation2 — REG-P1's cache (outputs/R6_REG, ×4 area-downsampled 512-px images, both input paths); the test split stays closed and untouched
  roles: "REG-P1's: FIT 32 train cores, CAL 8 train cores, DEV 32 (validation1 + validation2); the core (image pair) is the physical specimen and the independent unit; slides 1B / 2B are the strata"
  dev_exposure: "DEV was read by REG-P1 / REG-P2 (r6 reports); G1 results on it are development validation (docs/06 §2).  A confirmation on specimens not used in any design needs the closed test — not in this unit"
  manifest_check: "every unit records REG-P1's per-file sha256 (manifest.json) in its state hash; MI / NMI reuse requires the perturbations.json and manifest.json hashes recorded at run time (g1.mi_nmi_reuse_check)"
design:
  fit_fraction:
    values: [0.25, 1.0]
    rule: "round(frac × 32) cores by stratified random sampling over the two slides (largest-remainder allocation; ties by slide name), seeded by the unit seed (g1.sample_fit); 0.25 -> 8 cores (5 + 3 or 4 + 4 by seed); patches are never the sampling unit; realised cores and counts written to train.json / comir.json"
  train_mismatch:
    values: [0.0, 0.2]
    rule: >
      exactly round(ε n) of the positive correspondences of every training step receive a displaced moving-side position drawn uniformly from the
      admissible positions of the SAME training crop / image, rejecting positions closer than 2 patch radii to the true one (g1.mismatch_positions /
      g1.displaced).  Patch radius: critics 15 px (descriptor receptive-field half-width -> exclusion 30 px within the 160-px crop interior),
      kernel 4 px (9 × 9 patch -> 8 px, within Ω), CoMIR 64 px (half the 128-px crop -> 128 px: the displaced 182-px source crop never overlaps
      the true one).  This Q is conditional on the image and crop — it is NOT an unconditional pixel product (docs/06 §3).
    shared_across_methods: >
      the three critic objectives consume one data RNG stream per seed in the same order (REG-P1's loop; the mismatch draws come before the
      objective branch, test Mismatch.test_same_draws_for_every_objective), so vcs / logistic / infonce see identical displaced correspondences.
      CoMIR's sampling unit is the crop; its mismatches are drawn from the same seed stream at the crop level (disclosed: same fraction and seed,
      not the same positions).  The kernel fit draws its own displaced patch positions at the fitting positions (same fraction).
    label_access: "no mismatch label enters any loss, model, selection or registration; only the realised fraction is logged (train.json realised_mismatch_fraction)"
  methods:
    trainable: [VCS critic, matched logistic (BCE) critic, InfoNCE critic, CoMIR (official DenseUNet, REG-P1 recipe)]
    fitted_reference: "same-target RFF kernel critic (closed form on the sampled FIT, mismatch applied to its fitting pairs; bandwidth multiplier {0.5, 1, 2} on CAL) — one seed (901) per cell, descriptive row"
    no_training: "MI and NMI (per-image, deterministic): REG-P2's DEV / CAL results are reused after the hash check (no FIT dependence); MIND: no 2-D adapter exists in r6 -> not run; classical point-set CS: not applicable to dense BF/SHG (docs/06 §4) -> not run"
  training: "REG-P1's recipes unchanged (critics: AdamW 1e-3, 3 000 steps, 16 scenes × 128 positions on aligned 160-px crops, 12 checkpoints; CoMIR: 23 × 32 × 32 recipe, no checkpoint selection) — g1.cmd_train / g1.cmd_comir reproduce REG-P1's RNG consumption exactly at ε = 0"
  registration: "REG-P2 verbatim (src/v9/reg/r6_reg_p2.py): rigid family θ ∈ ±30°, |t| <= 51 px, REG-P2's perturbations.json (10 per CAL / DEV image), disk support r = 129, shared grid + Adam optimiser, warp-then-encode for critics, encode-once for CoMIR, kernel warp-then-extract; identical padding (reflection) and visible-pixel handling for every method (inherited)"
  selection: "REG-P2's lexicographic CAL rule over the unit's 12 checkpoints (success < 42, success < 9, lower median corner error, earliest) / kernel multiplier; CoMIR, MI, NMI none"
  seeds: [901, 902, 903]
  units: "4 trainable methods × 2 fractions × 2 mismatch levels × 3 seeds = 48 (configs/V9_REG_UNITS.csv) + 4 kernel rows (seed 901) + MI / NMI reused"
  reuse: >
    package rule "complete identity only": an r6 full-data clean unit is reusable when seed, FIT set (with data hashes), ε = 0, fraction 1 and the
    recipe match (g1.r6_reusable).  r6 used seeds 0–2; the package fixes seeds 901–903 -> 0 of the 48 units reusable, 48 new (CSV column reuse =
    none_seed_differs).  Owner option, not taken by default: map the frac 1 / ε 0 cell to the r6 seeds 0–2 and reuse the 12 r6 units (saves ≈ 9 GPU-h;
    then the clean cell and the other cells would differ in seed set).
metrics:
  primary: "per unit (core), success rate at < 42 px of CoMIR's mean corner error (four corners of the central 834-px full-resolution patch), unit-macro over the 32 DEV cores (REG-P2 metric)"
  secondary: "success < 9 px; median / p90 corner error; median rotation (°) and translation (px) error; failure count with energy-vs-search attribution (F at the estimate >= F at the truth = energy failure); s / registration; exact F profiles along θ and x for 5 DEV images (REG-P2 register writes them); success by translation stratum and |θ*| bin"
  statistics: "mean ± sd over the 3 seeds; contrasts VCS − X paired by seed (seeded X) or VCS seed vs the deterministic X, 95 % t over seeds and a unit bootstrap (2 000 resamples, indices shared across contrasts; all 10 perturbations of a core stay in its group) with a two-sided bootstrap p"
  primary_family: "VCS − MI and VCS − CoMIR at ε = 0.2, for fit fraction 0.25 and 1.0: 4 contrasts, Holm over 4; detected = seed-t interval and unit bootstrap interval both exclude 0 and Holm p < 0.05 (g1_aggregate.main)"
  interaction: "per method and fraction, the seed-paired change of success < 42 px from ε 0 to 0.2 (descriptive, with intervals); VCS − X differences of those changes reported, not tested"
  everything_else: "all VCS − X contrasts at every cell and both thresholds, reported in full; the fraction axis at ε = 0 is reported as the sample-size curve"
