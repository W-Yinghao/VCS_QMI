everything_else: 'all VCS − X contrasts at every cell and both thresholds, every cell, MI / NMI, the kernel rows: reported in full'
wording_fixed:
- interval containing 0 -> no detectable difference; above / below 0 -> VCS registers x more / fewer test cores
- VCS ≈ logistic ≈ InfoNCE -> a learned relational-energy class effect (owner wording 2026-10-12); never 'VCS-only' or 'the quadratic loss is robust'
- a stronger CoMIR / MI is reported as is; the baselines are never weakened
- TEST = the one confirmation read on 134 specimens unused in any design, training or selection; DEV (G1) stays development validation; DEV and TEST are reported side by side,
  never pooled
- a primary contrast detected on DEV and on TEST with the same sign -> 'replicated on the sealed test'; detected on DEV but not on TEST -> 'not replicated on the sealed test';
  detected on TEST only -> 'detected on the test only' (reported, not promoted); opposite signs -> 'reversed on the sealed test'
not_run:
- no re-selection, retraining or new unit; no other split; the test is not read a second time; EPFL (G2) has no sealed split and is untouched
