# ---------------------------------------------------------------------------------------------------- A. GenAI-Bench confirmation (registered source)
sample:
  source: "GenAI-Bench (BaiqiL/GenAI-Bench, HF; 1,600 prompts x 6 generators DALLE_3 / DeepFloyd_I_XL_v1 / Midjourney_6 / SDXL_2_1 / SDXL_Base / SDXL_Turbo; 12 parquet shards, local copy /projects/EEG-foundation-model/yinghao/data/genai_bench/data; card: https://huggingface.co/datasets/BaiqiL/GenAI-Bench; paper arXiv:2406.13743)"
  human_labels: "HumanRatings struct per generator = a sequence of 1-5 Likert ratings per image (several raters; the card says '1-to-5 Likert scale ratings for each image'); image score = the mean over its raters; the column has never been read by this project (x30_bench_inputs.py reads only Index / Prompt / images)"
  seal: "the 12 parquet files are the sealed label carrier; their sha256 (first 16: 7dc64a313e493fa0, b1a39973fe300886, 1a15d2c9123ad315, 560782dff0ac7ffe, 796fcddab21fc53b, f1a1dcd4d41ab302, 06d3b4c5ed0207e2, 50cf042a7c494630, aff312018ab4560b, 9da45c6ed3e315a6, 584997aa32a6af83, ca97e66cfc126741; sizes 377-416 MB) are re-hashed in full by the dry-run (--hash) and by `run`; the ledger row records the sha256 of their concatenation"
  prompt_list:
    rule: "a GenAI-Bench prompt is excluded if its text is exactly equal (no normalisation) to any of the 800 GenAI-Rank prompts (outputs/V7/data/genai_rank_prompts.jsonl); whitespace-stripped and case/whitespace-normalised matching give the same 750 / 850 split (checked 2026-10-15)"
    result: "overlap 750, confirmation 850 prompts; ids sha256 ee8cb0460bc52fd629cd46320d8fe76f0fac48f3c997bb956460c2d44f274cc7 (sorted prompt_ids joined by newline); file /projects/EEG-foundation-model/yinghao/outputs_v8/confirm_v1/nonrank_prompts.json; the V8-03 'list fixed from inputs only' is this list — no file existed before, it is built by `prompt-list` from inputs only"
    images: "850 x 6 = 5,100 images (outputs/V7/data/genai_bench_inputs.jsonl rows of those prompts)"
methods:
  v8: "the 24 frozen formal units V8-FIT-<arm>-s<seed> (8 arms x seeds 0-2; done.json 24 / 24; lr and epoch by the frozen rule, unchanged); score = the exported raw mu per image (pred/genai_bench.jsonl); U-CS and every arm enter as the seed mean of mu over seeds 0-2 (all seeds; no best-of-seed), per-seed values reported"
  external: "frozen GenAI-Bench predictions already produced by V7 (never scored against GenAI-Bench labels): B0 FGA released = x30_bench/native_B0_released/native_eval_bench.json (score_result), B1 VQAScore CLIP-FlanT5-XXL = x30_bench/b1_vqascore_clipflant5xxl.jsonl, B4T TIFA (local LLaMA-2 QG + mPLUG, the V7 route) = x30_bench/tifa_scores_0of1.jsonl, B4D DSG (local Qwen2.5-32B adaptation + mPLUG) = x30_bench/dsg_scores_0of1.jsonl; sha256 recorded by the dry-run; no re-run, no new external method"
metrics:
  spearman: "pooled image-level Spearman (average ranks on ties) between a method's score and the mean human rating over the scored confirmation images; per-generator Spearman reported as descriptive columns (not tested)"
  pairwise: "within-prompt pairwise preference accuracy: for each prompt all 15 pairs of its 6 images; a pair with equal human means is skipped; the method agrees with the human order (1), disagrees (0), ties (0.5); prompt mean, then mean over prompts with >= 1 informative pair"
  missing: "an image with no prediction in ANY of the compared methods (or no rating) is dropped for every method and listed in confirm.json (`dropped_images`, `images_without_rating`); `run` refuses if any V8 unit lacks its genai_bench export"
statistics:
  unit: "prompt; prompt-cluster bootstrap, 5,000 resamples, seed 2718 (as V7 / V8 scoring); Δ = metric(U-CS seed mean) − metric(comparator); 95 % percentile interval; two-sided bootstrap p = 2 min(P(Δ* <= 0), P(Δ* >= 0)) with floor 1/5000; Holm within each family"
  families:
    primary_spearman: "U-CS vs B0 FGA, B1 VQAScore, B4T TIFA, B4D DSG on pooled Spearman — 4 contrasts, Holm over 4 (the primary family)"
    primary_pairwise: "the same four comparators on pairwise accuracy — 4 contrasts, Holm over 4 (secondary family)"
    attribution: "U-CS vs U-BCE on both metrics — 2 contrasts, Holm over 2"
    same_data_descriptive: "U-CS vs U-RPS / U-CE / U-MSE / U-L1 / U-RANK / U-LIST on both metrics — intervals reported, no Holm, no claim (U-RANK is a failed arm: V8-04 §1)"
  levels: "pooled Spearman, pairwise accuracy and per-generator Spearman for every method and every V8 seed"
exposure_statement: "The 850 prompts were never used for any selection in this project (V8 lr / epoch by CAL_SELECT; V7 never scored on them; the 750 Rank-overlap prompts are excluded).  They remain the same benchmark family as GenAI-Rank: generators, semantic patterns and the upstream pretraining data of the hosts are not independent of what was seen; this is a 'prompts-not-used-for-selection confirmation set', not an independent benchmark."
readings_fixed_now:
  - "Positive: U-CS pooled Spearman above an external system with Holm p < 0.05 and the interval excluding 0 → 'on prompts not used for any selection in this project, the utility-aligned CS head agrees with human alignment ratings better than <system>' — only for that system and metric; no 'beats' across the family."
  - "Negative: U-CS below an external system under the same rule → reported in the same words with the sign reversed; the V8-04 GenAI-Rank picture is NOT re-read to soften it."
  - "Mixed / n.s.: intervals containing 0 are reported as 'no detectable difference on this set at this sample size'; the pairwise family does not rescue a null Spearman family."
  - "Attribution: U-CS vs U-BCE n.s. is expected (V8-04); a detected difference is reported, not explained post hoc."
  - "Whatever the outcome, this read feeds no further tuning, model choice, aggregation, temperature or host change (owner review 2026-10-15); the result goes into the V8 report as §7."
command_sequence:
  - "sbatch slurm/v8/v8_confirm.sbatch gate                    # tests/v8 + dry-run with --hash; must print ready_for_run=True (24 / 24 units, 4 / 4 external files, 12 shards)"
  - "main session: owner go → V8_05_CONFIRMATION_REQUEST.md marked CONFIRMED <utc> → protocol renamed *_FROZEN_<date>.yaml"
  - "sbatch slurm/v8/v8_confirm.sbatch run /projects/EEG-foundation-model/yinghao/outputs_v8/confirm_v1/run_v1   # ledger row, one label read, confirm.{json,md}; refuses to overwrite"
  - "results-only commit of run_v1/{confirm.json,confirm.md,dry_run.json} into reports/V8_UTILITY/V8_CONFIRM_results/; then the report section"
ledger_row: "dataset=GenAI-Bench human ratings (HumanRatings column; 850 non-Rank prompts x 6 generators); prompt_set_hash = sha256 of the sorted confirmation ids; label_file_hash = sha256 of the concatenated 12 parquet shards; purpose = V8-05 confirmation families; authorized_by = owner decision 2026-10-15; affected models = the 24 frozen V8 units (no selection after the read); already_exposed = no"
refusals: "run refuses without --allow-scoring, without a CONFIRMED request file, when any V8 unit's genai_bench export is missing, when any external file is missing, when the output exists"
not_claimed: "independence from the GenAI-Rank benchmark family; anything about the 750 overlap prompts; any V7 method on these prompts (not scored); capacity of the utility losses (V8-04 Corrections 2); a general ranking of alignment metrics"

