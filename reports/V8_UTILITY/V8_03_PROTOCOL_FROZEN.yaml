branch: v8/utility-aligned-cs
dirs: {reports: reports/V8_UTILITY, outputs: /projects/EEG-foundation-model/yinghao/outputs_v8}
keep_original_S_J: true
labels:
  source: "EvalMuse public TRAIN, V7 data manifest (outputs/V7/data/manifest_images.jsonl): overall_votes (valid integer 1-5 votes per image)"
  roles: "V7's roles unchanged: FIT 26,177 images (training), CAL_SELECT 1,653 (epoch / lr selection), CAL_PROB 1,630 (secondary calibration), DEV 3,257 (development, already exposed)"
  events: "C_k = 1{H >= k}, k = 2..5; per image y_k = share of its valid votes >= k; hist_h = share = h"
  natural_sampling: "uniform prompt -> uniform valid image -> uniform valid vote (3- and 6-vote images weigh the same)"
  priors: "pi_k = E_D[y_k] on FIT = 0.88809 / 0.56252 / 0.28794 / 0.11840 (V8-01); no degenerate threshold"
  overall_valid: "every image with >= 1 valid vote (all images of the four roles); element-level flags never remove an image"
model:
  construction: "V7's frozen build_model: FGA_Blip2 'coco' config, public BLIP-2 COCO weights (blip2_finetune_coco.pth), EVA ViT-g frozen in eval mode"
  trained: "ln_vision, Q-former and query tokens (V7's trained set) + the shared 5-logit head; V7's ITM / mask / projection heads unused and frozen"
  head: "Linear(768 -> 5) on the mean of the 32 query outputs, fp32; weight ~ N(0, 0.02) from a generator seeded by the unit seed; bias = log FIT natural histogram; identical for all arms at a seed"
  input: "full-frame resize 364 (BLIP eval processor: no crop / flip); raw prompt, uncased BERT, <= 128 tokens, never truncated"
outputs: "q (5-level histogram), u_k = P(H >= k), ell_k = logit u_k - logit pi_k, T_k = tanh(ell_k / 2), mu = 1 + sum_k u_k (primary score)"
arms:
  U-CS: "mean_k [y_k (1 - T_k)^2 / (8 pi_k) + (1 - y_k)(1 + T_k)^2 / (8 (1 - pi_k))] = 1/4 sum_k a_k (1 - J_k), a_k = 1/4 (the original J per threshold)"
  U-BCE: "balanced BCE on the same ell (attribution control)"
  U-RPS: "mean_k [y_k (1 - u_k)^2 + (1 - y_k) u_k^2] (random-rater RPS; = U-CS when every pi_k = 1/2)"
  U-CE: "- sum_h hist_h log q_h"
  U-MSE: "((mu - Hbar) / 4)^2"
  U-L1: "|mu - Hbar| / 4"
  U-RANK: "U-MSE + RankNet BCE on (mu_i - mu_j) / tau over a subgroup's unordered pairs (targets 1 / 0 / 0.5 for ties), tau = 1, lambda = 1"
  U-LIST: "U-MSE + ListNet top-one CE softmax(Hbar / tau) vs softmax(mu / tau), tau = 1, lambda = 1"
  code: "scripts/v8/v8_core.py (equal to the package reference, tests/v8)"
batches:
  plan: "per (seed, epoch), shared by all arms: prompts shuffled; each prompt's images shuffled and split into ceil(n / 7) near-equal subgroups (15 -> 5/5/5, 13 -> 7/6); subgroups shuffled and packed first-fit into batches of <= 14 images; every FIT image once per epoch, the last batch kept"
  weights: "point terms: natural prompt -> image weights, sum w l / sum w over the batch; ranking terms: averaged within each subgroup of >= 2 images, each subgroup weighted 1 / (number of its prompt's subgroups), normalised over the batch; pair / list exposure counts logged"
optimisation:
  optimiser: "AdamW (0.9, 0.999); weight decay 0.05 on matrices, 0 on biases / norms / query tokens"
  schedule: "linear warm-up from 1e-8 over 100 optimiser steps, then cosine to 0 over the actual total steps"
  precision: "AMP fp16 for the multimodal forward with GradScaler; head, softplus / log-sum-exp, risks and normalisers in fp32"
  epochs: 5
selection:
  epoch: "CAL_SELECT prompt-macro mean-rating MSE of raw mu; ties -> earlier epoch"
  lr: "tuning seed 17, lr in {5e-6, 1e-5, 2e-5} per arm, full 5 epochs; the arm's lr = lowest CAL_SELECT mean-rating MSE at its selected epoch (ties -> lower lr)"
  secondary: "CAL_SELECT within-prompt pairwise accuracy, RPS, CE and each arm's native loss are logged; never used for selection; DEV / GenAI never used"
  calibration: "CAL_PROB temperature on the 5 logits (secondary only; keeps the simplex and the order)"
units:
  tuning: "8 arms x 3 lr at seed 17 = 24 (configs/TUNING_UNITS.csv)"
  formal: "8 arms x seeds {0, 1, 2} at the arm's selected lr = 24 (configs/FIT_UNITS.csv); every seed is run, no seed-0 screen"
  budget: "48 full units; GPU smoke (job 1040556, L40S): 0.4 s per optimiser step, peak 7.8 GB -> ~2,100 grouped steps per epoch x 5 + CAL evals ~ 1.35 h per unit -> ~65 GPU-h; one-epoch timing job 1040557 confirms"
kernel_bridges:
  features: "V7X-20 X20 features (768-d mean of the 32 query outputs of the same untrained BLIP-2; FIT-weighted standardisation); PCA64 / 256 as common sensitivities only"
  per_threshold: "P_k proportional to w y_k, Q_k to w (1 - y_k); KDE: T = tanh((log p - log q) / 2); RuLSIF alpha = 1/2: T = r - 1; Nystrom: squared regression of the balanced label"
  grid: "bandwidth multiples {0.25, 0.5, 1, 2, 4}, ridge {1e-6, 1e-4, 1e-2, 1}, centres {256, 1024, 4096}; one directional edge extension as V7X-20"
  selection: "one joint configuration per route over the four thresholds by CAL_SELECT mu-MSE (native CV secondary)"
  readout: "natural tails recovered from T with the FIT priors; raw (possibly crossing) tails kept; a PAVA-monotone column as a secondary readout for every method"
evaluation:
  tables: "A complete systems (V7 frozen predictions + V8), B same-data training (8 arms x 3 seeds), C kernel bridges"
  primary_external: "U-CS vs B0 FGA, B1 VQAScore, B4T TIFA, B4D DSG on GenAI-Rank DALLE_3 / SDXL_Base, N = 9, official first-index ties; 8 contrasts; prompt-cluster bootstrap 5,000 (seed 2718), Holm; external predictions reused unchanged from V7X-50 v2"
  same_conditions: "U-CS vs U-RPS, U-MSE, U-RANK, U-LIST on both generators (8, Holm); U-CS vs U-BCE (2, attribution); U-CE / U-L1 reported in full"
  distribution: "per-threshold natural Brier, normalised RPS, histogram log loss, mean-rating MSE / MAE on CAL_PROB and DEV (development)"
  exposure: "GenAI-Rank: pre-specified follow-up comparison on the same benchmark (V8 frozen before V7's read); confirmation source registered now: the GenAI-Bench prompts without a GenAI-Rank text match (list fixed from inputs only; 850 by the V7 reuse step), labels sealed; TIFA160 / RichHF alignment as fallbacks if that source is exposed or unusable before the first V8 result"
not_claimed: "a new functional, first use of ordinal / distribution scoring, a causal reading of histograms, uncertainty of the mean from the predicted spread, any GenAI-tuned choice"
gate_before_freeze: "CPU tests: tests/v8 24 / 24 and the package reference tests 75 / 75 (job 1040540).  GPU smoke (job 1040556, L40S node57, commit f7718b2): all 8 arms, 20 steps x 5 epochs + CAL_SELECT eval on 64 images, exit 0; ranking terms active in U-RANK / U-LIST (2 subgroups, 26 pairs per step); identical head init across arms (bias = log FIT histogram); 186,314,048 trainable parameters; peak 7.8 GB; the export of U-CS scored the full CAL_SELECT (1,653 images).  Smoke CAL numbers are not results (100 steps, 64 images)."
