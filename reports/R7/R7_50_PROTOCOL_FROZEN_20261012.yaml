# R7-50 — one-shot official-test evaluation.  PROTOCOL DRAFT for the coordinator's freeze (2026-10-12).
# Implements reports/R7/R7_50_60_OUTLINE_DRAFT.md §A as approved, plus the owner directive of 2026-10-12 relayed by the coordinator ("还是多做全量
# 实验，要不结论不保真"): a full-scale integrity gate before any test generation, and three pre-declared generation phases (L, F, Q).  Drafted while
# D1-20 stage 2, D1-FULL and the D1-30 driver run, before any D1-30 result was read, and without opening, listing, hashing or loading any
# official test file (code checked on synthetic CPU tests and smoked on non-test data only: GQA DEV / balanced val, ChartQA val / train).
# To freeze: copy to reports/R7/R7_50_PROTOCOL_FROZEN_20261012.yaml (the driver's default path), set 'status: frozen', add the top-level key
# 'r7_50_freeze_20261012:' with the coordinator's note (the build and the driver check both: a line starting 'status: frozen' and a line
# starting 'r7_50_freeze_<yyyymmdd>:'), resolve open_decisions, and commit it together with code.commit_list.
protocol_id: R7-50
status: frozen   # 2026-10-12, coordinator; the decisions are in r7_50_freeze_20261012 below
date: 2026-10-12
parent: "reports/R7/R7_50_60_OUTLINE_DRAFT.md §A (approved; A.3 latency at each host's own B*, commit 4ba4860); D1-30 staged freeze reports/R7/R7_D1_30_STAGED_FREEZE_20261012.yaml with execution notes E1-E3 in reports/R7/R7_D1_PROTOCOL_FROZEN_20261012.yaml"

approval:
  owner_final_go: "2026-10-12 10:16 UTC: '我都确认', scope '两项都批准' (reports/OWNER_DECISIONS_20261012.md 七; commit b22c540): one read of GQA testdev-balanced and ChartQA test for R7-50; LLaVA rows once D1-20 is complete, Qwen rows once R7-40 is complete; protocol frozen before any D1-30 result"
  adopted_corrections: "graded exposure statement, profiling-workload latency, evaluation protection by the frozen analysis (A.4.5), all pre-registered rows reported (OWNER_DECISIONS T1 [已定])"
  owner_directive_20261012: "全量实验: (1) full-scale integrity gate before any test generation (any mismatch stops); (2) phases L / F / Q with every row declared now; each phase hash-committed and then scored once; test results never choose rows (relayed by the coordinator, 2026-10-12)"
  coordinator_decisions_20261012_before_any_rehearsal_number:
    gate_rule: "deterministic rows (full, grid-144, S1 seed 0 at 144): identical answer, kept count and input on every item; SparseVLM-192: answer agreement >= 98.0 % (documented run-to-run agreement 99.1 %), kept counts identical and the E3 counter within tolerance; anything below stops the driver; the same rule for phase F's gate"
    F2: "phase F's gate reference is D1-FULL's own D1-30-style full-scale DEV / val outputs (the D1-FULL agent produces them); F_INTEGRITY_REF=none is not allowed"
    F3: "D1-FULL's dynamic rows get their own timing run with the D1-30 procedure on nodesumo01 (the D1-FULL agent runs it); phase F's manifest seals it and its scoring requires it"
    D50-5: "GQA's test splits extend Visual Genome with new images whose scene graphs are hidden (Hudson & Manning 2019, p. 4 footnote 2 and p. 17), so test-dev images need not be VG images; the coordinator corrects the outline's exposure sentence; the build counts the test-dev image ids by prefix ('n'-prefixed vs numeric VG ids) and the exposure statement reports the counts (image ids only, never labels)"
    qid_seeding: "the uniform-grid rows on ChartQA test are seeded by the official chartqa_test_<row index> ids (deterministic, fixed before the read)"

phases:
  L: {what: "LLaVA-1.5-7B rows with the D1-20 selectors (10k FIT images)", after: "D1-20 complete and D1-30 stage 1 complete", rows_generated: 58, status: "implemented, smoked"}
  F: {what: "LLaVA-1.5-7B selector rows with the D1-FULL selectors (retrained on all 62,852 eligible GQA train images, same CAL / DEV / recipe)", after: "D1-FULL complete", rows_generated: 45, baseline_rows: "full, uniform grid and SparseVLM are phase L's sealed predictions (not regenerated)", status: "implemented, smoked with D1-FULL-like random selectors"}
  Q: {what: "Qwen2.5-VL-7B rows", after: "R7-40 complete", status: "declared only: needs its addendum and the R7-40c Qwen runner (the driver refuses PHASE=Q)"}
  rule: "each phase: generation -> sha256 manifest -> committed -> ALLOW_SCORING_<P> -> one scoring job; a phase never changes another phase's rows or results; test results never choose rows, checkpoints or operating points"

