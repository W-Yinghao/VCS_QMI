# R7-40b staged freeze (Qwen2.5-VL selectors S1 VCS / S2 logistic / S3 direct with the frozen D1-20 recipe).  Coordinator, 2026-10-12, after
# R7-40a completed (completeness: CAL 7,989 + FIT 39,960, manifest sha256 unchanged) and its CAL readout (commit 2372208; DEV sealed), before any
# R7-40b unit and before any D1-30 result.  Draft: reports/R7/R7_40_PROTOCOL_DRAFT_20261012.yaml (open_decisions.before_the_40b_freeze answered here).
status: frozen
scope: "R7-40b only: feature cache + 6 seed-0 learning-rate-search units + the frozen choice + 6 stage-2 units (S1 / S2 / S3; S2 per owner decision 2026-10-12)"
decisions:
  OPEN-R740-3_lr_search: "re-run the symmetric 2-rate seed-0 search {1e-4, 3e-4} on Qwen with the frozen D1-20 choice rule (implemented); the LLaVA rates are not reused"
  D40b-2_micro_batching: >
    accepted as an implementation of the frozen recipe: each 64-question step is split into length-sorted micro-batches by an exact dynamic
    programme under the frozen memory cap, every micro-batch normalised by the step's global weights, so loss and gradient equal the unsplit step
    (tested for S1–S3); only dropout draws differ (disclosed).
  D40b-3_selector_hardware: >
    SEL_PARTITION=L40S and CACHE_PARTITION=L40S — one GPU class for every R7-40 training stage, the class of the 40a teacher; worst case at the
    memory cap 25.6 GB measured on L40S (no out-of-memory); about 1.9 GPU-h per unit.  (E5's RTX6000PRO,H100 restriction was a LLaVA memory
    limit and does not bind on Qwen.)
  D40b-4_position_tables: "64 × 64 row / column tables; a larger grid stops the unit; the cache job records the FIT / CAL maxima (CAL readout: at most 1,247 merged tokens per image)"
  D40b-5_dynamic_rule: "nominal fractions in the dynamic rule (k = round(f · N); the mean kept fraction is computed with the nominal f)"
  yes_no_mass: "as 40a: the primary keeps every item; the secondary without full-pass mass < 0.9 (CAL 367 / 7,989, FIT 1,768 / 39,960; almost all logical 'either X or Y' items) is reported"
  time_limits: "unit sbatch limits lowered from 12 h to 6 h (about 3 × the measured unit cost) so units can backfill; drivers resubmit a unit that hits its limit"
launch: "SEL_PARTITION=L40S CACHE_PARTITION=L40S nohup setsid bash slurm/r7_d1_40_submit.sh 40b  (CAP 27; log slurm_logs/r7_d1_40_submit.log)"
budget: "cache about 0.8 GPU-h + 12 units × about 1.9 GPU-h on L40S ≈ 23 GPU-h"
execution_note_40b_1: >
  2026-10-12 ~17:05 UTC, coordinator, before any 40b unit ran (the cache job 1036206 was still pending; nothing produced, nothing read): the
  selector and cache partitions are widened from L40S to RTX6000PRO,H100,L40S.  Reason: every L40S was occupied while two RTX PRO 6000 GPUs
  sat idle, and RTX is about 2× faster for these units.  Check first: an RTX selector smoke (job 1036280, RTX PRO 6000 Blackwell) ran all three
  objectives and its GPU check matched CPU fp64 within 6.1e-6 (rel. loss / gradients, as on L40S).  Each unit still runs on one GPU; units may
  differ in GPU type, as D1-20's did (RTX / H100).  The pending cache job was cancelled and the 40b driver (pid 1132352) stopped and relaunched
  with SEL_PARTITION=RTX6000PRO,H100,L40S CACHE_PARTITION=RTX6000PRO,H100,L40S.  No analysis change.
execution_note_40b_2: >
  2026-10-12 ~21:00 UTC, coordinator: selector unit direct_lr0.0001_s0 (job 1036397, node57, L40S) ran out of GPU memory (43.7 GiB in use,
  7.5 GiB more requested): the 25.6 GB smoke measurement did not cover the full-size run for the direct objective (the E5 lesson again).
  Every 40b selector unit now runs on RTX6000PRO,H100 only (>= 80 GB): the pending unit was moved, and slurm/part_updater.sh (PAT
  '^r7d40s_', 5 s) moves the driver's retry and later units before they start (the driver is not restarted, which would duplicate running
  units).  The failed unit is retried by the driver (resuming from its last checkpoint if any).  No analysis change.
execution_note_40b_3: >
  2026-10-13 ~03:00 UTC, coordinator: when the frozen choice (lr_choice.json: vcs 3e-4, logistic 1e-4, direct 3e-4) released stage 2, two
  direct-objective units started on L40S in the same second they were submitted (the scheduler starts a job at submission when a card is free),
  before part_updater.sh could move them — the 40b_2 measure cannot win that race.  All six stage-2 jobs were cancelled after about 30 s
  (nothing written but at most a first checkpoint), the 40b driver was stopped and restarted with SEL_PARTITION=RTX6000PRO,H100 (the cache and
  the six seed-0 units are complete and were skipped; the choice was re-read unchanged), and it resubmitted the six units on RTX6000PRO,H100
  only (jobs 1036721–1036726).  No analysis change.
