# ------------------------------------------------------------------------------------------------------------------------------ code, driver
code:
  new_files: >
    scripts/r7_d1full_data.py (build / verify / freeze / reuse / plan / complete / data / precheck); r7_d1full_teacher.py (strict source,
    bundle wrapper, GPU replay); r7_d1full_cache.py (streamed frozen-format cache, PCA basis option); r7_d1full_train.py (frozen trainer
    wrapper, finish path, memory smoke); r7_d1full_plan.py (selector lines, choice, evaluation configs / lines incl. timing);
    r7_d1full_score.py (readout); r7_d1full_smoke.py (GPU smoke); tests/test_r7_d1full.py; slurm/r7_d1full_{cpu,gpu,sel}.sbatch;
    slurm/r7_d1full_submit.sh
  frozen_files_used_read_only: "r7_d1_data, r7_d1_masks, r7_d1_teacher, r7_vl_common, r7_d1_cache, r7_d1_selectors, r7_d1_train, r7_d1_analyze, r7_d1_plan20, r7_d1_30_run, r7_d1_30_timing, r7_d1_30_devrisk, r7_d1_30_score, r7_d1_30_sparsevlm, r7_d1_30_data"
driver:
  file: slurm/r7_d1full_submit.sh
  command: "nohup setsid bash slurm/r7_d1full_submit.sh >/dev/null 2>&1 &   (stop by PID; log slurm_logs/r7_d1full_submit.log; decisions via PCA_BASIS=fitfull|frozen, DEVRISK=1|0, TIMING=1)"
  stages: >
    0 gates: freeze key, PCA_BASIS valid, passing probe report.  1 data: CPU, sbatch --wait — build if absent, verify, freeze the D1-FULL
    manifest, reuse check + verified copy, plan, teacher lines.  2 teacher bundles.  3 completeness: CPU, --wait.  4 cache.  5 LR search (6
    units).  6 choice: CPU, --wait, with a 15-min visibility wait (the E4 lesson).  7 stage 2 (12 units).  8 evaluation: needs the D1-30 freeze
    key and the D1-30 sets; selector-row configs, then 12 quality shards and 3 timing units on nodesumo01; the DEV-risk unit follows once
    D1-30's DEV-risk output exists.  No readout stage: the readout is the coordinator's, after the D1-30 readout.
  rules: >
    File gates only, no afterok chains.  CAP 27 on `squeue -h -u $USER -q normal | wc -l` before every submission.  An empty or non-numeric
    job id STOPs.  A unit that left the queue (listed empty or 'Invalid job id') without its marker is resubmitted at most RETRIES = 2
    times, after a 1-min marker visibility wait; every unit resumes.  No --export.  Every GPU line excludes node51,node52,node60.  LLaVA-env
    units run on H100,L40S, selector units on RTX6000PRO,H100, timing on nodesumo01.  Time limits are about 3× the expected runtime, for
    backfill: bundle 4 h, cache 6 h, selector unit 8 h, quality shard 5 h, DEV risk 2 h, timing 5 h.

