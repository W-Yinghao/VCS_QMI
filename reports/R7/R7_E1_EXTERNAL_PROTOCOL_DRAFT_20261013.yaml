# R7-E1 — external Qwen2.5-VL-7B-Instruct token-pruning baselines (MMTok, HiPrune) as a separate host column next to R7-40c: PROTOCOL DRAFT
# for the coordinator's staged freeze.  Nothing here is frozen.  Written 2026-10-13 (agent) after the coordinator's extension decision
# (reports/R7/R7_EXTENSIONS_DECISION_20261013.md, E1, commit dbf628d), before any E1 GPU job and without reading any R7-40c / D1-30 / D1-FULL /
# R7-50 result, prediction or score.  Validation data only (GQA DEV, TextVQA val, ChartQA val); no official-test file opened; nothing under
# outputs/R7_50/sealed/ touched.  Only CPU jobs ran (env builds, import checks, CPU self-checks on synthetic images, stub tests, the unit plan).
protocol_id: R7-E1
status: draft_for_staged_freeze      # proposed freeze key 'r7_e1_staged_freeze' (the E1 readout, still to be written, refuses without it)
date: 2026-10-13
parents:
  - "reports/R7/R7_EXTENSIONS_DECISION_20261013.md (E1: MMTok + HiPrune, fractions 0.125 / 0.25 / 0.5 / 0.75, separate host columns, outside every primary family, quality at fixed fractions, batch-1 latency secondary; IF-Prune stays excluded)"
  - "reports/R7/R7_40C_PROTOCOL_DRAFT_20261012.yaml: external_baseline_OPEN_R740C_4 (admissible alternatives, pins and constraints found at the R7-40c freeze), host_and_generation, evaluation_sets, statistics"
  - "reports/R7/R7_40C_STAGED_FREEZE_20261013.yaml (R7-40c frozen; external baseline = disclosed gap there; this draft is its later addendum)"

scope_rules:
  - "each method runs as its official code ships it (no algorithm change), in its own pinned environment, at batch 1 (both are batch-1 only)"
  - "inputs and outputs are R7-40c's: the frozen D1-30 validation sets and shard order, the pinned prompts in the Qwen chat template, R7-40c's pixel bounds and image processor class, greedy generation with R7-40c's max_new_tokens and the shipped generation config, R7-40c's prediction-file layout"
  - "a separate host column (owner I1): never a same-condition head-to-head with S1 / S2 / S3 / grid, outside every primary family, no test, no Holm; descriptive side-by-side only"
  - "no official-test read (an official-test column would need a new owner approval); no change to any frozen R7-40c file"

# ------------------------------------------------------------------------------------------------------------------------------ methods
methods:
  admissibility: "both on the admissible list recorded at the R7-40c freeze (official Qwen2.5-VL code by the authors + a licence file); chosen by the coordinator before any R7-40c result existed"
  fetch: >
    2026-10-13 ~11:47 UTC, login node, network only: git clone --no-checkout into a NEW empty directory, checkout of the exact commit (hooks
    disabled), then chmod -R a-w; git status clean afterwards (re-checked after every job).  Never used as a working directory: the E1 glue
    appends the tree to sys.path (python -I), so nothing is written into it (no __pycache__, no egg-info).  Read before anything ran: README,
    LICENSE, install / setup files, requirements / pyproject, the Qwen wrappers / modeling files, the core selection code, the lmms-eval adapters.
  mmtok:
    paper: "MMTok: Multimodal Coverage Maximization for Efficient Inference of VLMs (ICLR 2026; arXiv 2508.18264)"
    repo: "github.com/Ironieser/MMTok"
    commit: "8e2686836ed5bbe05d064f1d1c20e50c73c70b94 (HEAD, 2026-09-02, README only after the code release 5b186b6 of 2026-02-20T14:24:18Z)"
    tree: "/projects/EEG-foundation-model/yinghao/third_party/MMTok@8e26868 (read-only)"
    licence: "Apache-2.0 — LICENSE present (Copyright 2025 Zoom Communications, Inc.); sha256 prefix c268112ad7499f84"
    selection: "question-conditioned: greedy maximum coverage of (P) the text tokens of the user text and (Q) the visual token set (score = coverage gain of P + alpha × coverage gain of Q, softmax-normalised cosine similarities), over the merged visual tokens after the vision merger, before the LLM"
    code_used: >
      mmtok.qwen.mmtok_qwen2_5_vl(model, language_tokenizer, processor, retain_ratio) — the official wrapper of its Qwen example and lmms-eval
      adapter — applied once per process to transformers' Qwen2_5_VLForConditionalGeneration (4.52.4): it binds Qwen2_5_VL_MMTok.forward to
      model.model, the MMTok vision forward (merged tokens + 2×2-pooled pre-merger features) to model.model.visual, and patches
      processor.apply_chat_template so that the user text reaches the selector (mmtok/qwen/qwen2_5_vl_mmtok.py, qwen2_5_VLmodel_mmtok.py,
      modeling_qwen2_5_vl_mmtok.py, core/mmtok_core.py, core/semantic_selector.py; sha256 prefixes c4f243645debb3bc, 3268ce72c772e303,
      37ff1d952d784566, fb891cda55999601, 1f2f9aac0e2d5b90)
    knob: "retain_ratio = f (wrapper argument, stored as MMTokCore.retain_ratio and read first by the patched forward); its fallback TOKEN_RETAIN_RATIO is set to the same value and SELECTION_METHOD=mmtok in the worker's environment (the inherited MMTok_JIT_* thresholds are removed, so the defaults 500 / 20 apply)"
    defaults_kept: "alpha 0.5, softmax_tv_temperature 0.01, softmax_vv_temperature 0.2, remove_padding_indices False (the Qwen wrapper's config); text = 'Question: ' + the user text, tokenised word by word with the fast Qwen tokenizer (processor.tokenizer, as the example), embedded with the model's input embeddings"
    question_text: "the full user text = the item's pinned prompt including its answer-format suffix (the official hook extracts every text part of the user message; its keyword cleaning is off on the Qwen path) — the same as in its lmms-eval runs, whose GQA prompt carries the same suffix"
    attention: "SDPA (its Qwen example; as R7-40c)"
    paper_operating_points: "Qwen2.5-VL-7B GQA / TextVQA at 20 / 10 / 5 % (not ours)"
  hiprune:
    paper: "HiPrune: Hierarchical Attention for Efficient Token Pruning in Vision-Language Models (ACL 2026 Findings; arXiv 2508.00553; AAAI-26 student abstract)"
    repo: "github.com/Danielement321/HiPrune"
    commit: "82781005a7e72a6be9ede58fd77473efa72b5e4f (HEAD, 2026-04-29, README only; the Qwen code last changed in 716f2d5, 2025-09-24T15:29:24Z)"
    tree: "/projects/EEG-foundation-model/yinghao/third_party/HiPrune@8278100 (read-only)"
    licence: "MIT — LICENSE present (Copyright 2025 Jizhihui Liu); sha256 prefix d0446d133993d989"
    selection: >
      question-agnostic, from the vision encoder's attention: per block, the attention each token receives (mean over heads and queries, pooled
      over its 2×2 merge group, raster order); anchors = top round(alpha·k / 5) tokens of block OBJECT_LAYER − 1 = 15 (a full-attention block),
      buffers = their ±1 and ±width neighbours (clamped, deduplicated; the ±1 neighbours wrap across rows, as shipped), registers = the top
      remaining tokens of the last block (31, full attention) until k tokens; kept tokens keep their full-sequence 3-D rotary ids; pruned before the LLM
    code_used: "the repo's full modeling copy Qwen2_5_VL/qwen2_5_vl_HiPrune.py (sha256 prefix bd3801b00e2a2c66; old-structure classes, transformers 4.52.0), imported as its lmms-eval wrapper does (from Qwen2_5_VL.qwen2_5_vl_HiPrune import Qwen2_5_VLForConditionalGeneration) and loaded with from_pretrained on the local checkpoint"
    knob: "HIPRUNE_QWEN_RETENTION = f, HIPRUNE_ALPHA = 0.1, HIPRUNE_OBJECT_LAYER = 16 (README Qwen defaults; eval_scripts/bench_qwen.sh uses the same alpha / layer), read from the environment at import -> one interpreter per fraction; the worker checks the module's RETAIN / ALPHA / OBJECT_LAYER"
    attention: >
      flash_attention_2 for the vision tower and the LLM (setup_qwen.sh: 'FlashAttention is required'; bench_qwen.sh).  SDPA is refused by its
      vision blocks (assert).  Eager is NOT usable for pruned rows: CPU self-check job 1037485 / 1037502 — with eager attention every pruned
      prefill fails inside the shipped _prepare_4d_causal_attention_mask_with_cache_position (the mask is built from generate's unpruned
      cache_position: 'size of tensor a (70) must match ... b (303)'), after the selection ran; with flash_attention_2 the shipped
      _update_causal_mask returns None at batch 1 (no padding), so no mask is built.  FA2 therefore runs only on GPUs flash-attn 2.8.3 supports
      (L40S, H100); verified only by the GPU smoke
    paper_operating_points: "Qwen2.5-VL at retention 0.334 / 0.223 / 0.112 (README defaults; not ours)"

# ------------------------------------------------------------------------------------------------------------------------------ environments
environments:
