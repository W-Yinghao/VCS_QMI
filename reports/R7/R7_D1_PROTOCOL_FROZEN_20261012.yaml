coordinator_note_20261012_rank_criterion: >
  Added before any D1-10 CAL readout (the teacher has not run), prompted by D1-L1 (outputs/R7_D1/L1/d1_l1.md; reports/R7/R7_D1_L1_light_check.md):
  even a perfectly calibrated full teacher gives a per-item corr(h, d) of only about 0.44–0.48 and P(h < 0) of about 0.35–0.43, because h
  contains the label C (Bernoulli noise) and d does not.  The interpretation-grid line "per-item Spearman < 0.5 => d does not rank
  per-question losses" would therefore fire for a perfect teacher.  It is read instead against a calibrated-teacher ceiling computed on the
  same CAL items: redraw C ~ Bernoulli(b) from the full teacher's own probabilities (B = 200 draws), recompute Spearman(h, d) per draw, and
  report the observed value with the ceiling's 2.5–97.5 % band.  "d does not rank per-question losses" is written only if the observed
  value lies below the band's lower end by more than its image-clustered bootstrap margin.  Every other line of the grid is unchanged; the
  original 0.5 line is still reported, labelled "superseded (unattainable for a calibrated teacher)".
