    value: "L40S (proposed): 240,827 × 0.2655 s = 17.8 h + 31 loads × 242 s = 2.1 h + per-bundle replay ≈ 0.15 h ≈ 20 GPU-h (bundle ≈ 40 min); H100 (not proposed): ≈ 10–12 GPU-h; recompute of FIT-000..039 if reuse fails: + ≈ 3.3 GPU-h on L40S"
    source: "the two rows above"
  cache_size:
    value: "feats_FIT ≈ 22.8 GB (10k: 3,240,925,312 B for 3,164,966 tokens, mean 316.5 per image, × 70,256 / 10,000 = 7.03); feats_CAL 0.64 GB, embed_table 1.09 GB, pca 7 MB, question ids ≈ 24 MB (unchanged or × 6) -> ≈ 24.5 GB (10k cache: 4.98 GB)"
    source: "ls of outputs/R7_D1/r7_40/cache; cache_d1_40.json (job 1036281)"
  cache_time_and_memory:
    value: "≈ 3.0 h on one GPU (PCA pass 70,256 × 71 ms + FIT encode 70,256 × 77 ms + CAL 154 s + load 317 s + save); GPU peak ≈ 17 GB (unchanged: features leave the GPU per image); host RAM ≈ 46 GB at the concatenation (< --mem 96G); limit 10 h (one pass, not resumable)"
    source: "cache_d1_40.json of job 1036281 (RTX PRO 6000: pca 711.5 s / 10,000 images, FIT 773.5 s / 10,000, CAL 153.9 s / 2,000, peak 17.0 GB); scripts/r7_d1_40_cache.py encode_role40 (list + np.concatenate)"
  selector_gpu_memory:
    value: >
      ≈ 69 GiB allocated at FIT_FULL: the 10k units peaked at 48.95–49.06 GiB allocated (all 12, RTX PRO 6000 and H100 NVL) with a static FIT
      footprint of 3.02 GiB features + 0.29 GiB rank tables (N_max already 1,280 at 10k); FIT_FULL adds 18.2 GiB features (22.8 GB fp16) + 1.7 GiB
