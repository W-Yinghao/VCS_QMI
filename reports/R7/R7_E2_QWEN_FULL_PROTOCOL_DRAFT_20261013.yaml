# r7 E2 — Qwen2.5-VL-7B full-data replication (the Qwen analogue of D1-FULL): DRAFT for the coordinator's staged freezes.  NOT frozen.
# Staged as D1-20 / D1-30 / D1-FULL / R7-40: stage E2a (the teacher) is frozen first and alone, with the top-level key 'r7_e2a_staged_freeze';
# the cache, selectors, evaluation and readout (E2b / E2c) are frozen later with 'r7_e2_staged_freeze'.  Both keys go into
# reports/R7/R7_D1_PROTOCOL_FROZEN_20261012.yaml (with a pointer to a frozen copy of this file); slurm/r7_e2_submit.sh (teacher | rest | all),
# scripts/r7_e2_data.py data and scripts/r7_e2_score.py refuse to run without them.
# Nothing below has run except the CPU tests and the CPU precheck under provenance.  No E2 GPU job (smoke, teacher, cache, selector, evaluation)
# has run.  Written without opening any R7-40c / D1-30 / D1-FULL prediction, score or result file, any Qwen DEV teacher record, any official-test
# file or anything under outputs/R7_50/sealed; R7-40c's shard markers (GPU, seconds, answers, set sha256) and job logs were read for costs only.
# Disclosure: after this design and its code were written, a 'git log' (repository state check) showed the subject line of the R7-40c report
# commit 5de605a; nothing in this draft was changed because of it, and the report itself was not opened.
title: "r7 E2: the frozen R7-40 Qwen2.5-VL-7B pipeline (R7-40a teacher, R7-40b selectors with the CAL rate rule, R7-40c evaluation) on D1-FULL's FIT_FULL"
status: draft
date: 2026-10-13
directive: 'owner "多做全量实验" (run full-data experiments); coordinator decision E2, reports/R7/R7_EXTENSIONS_DECISION_20261013.md (2026-10-13 11:39:56 UTC, 48 s before the R7-40c result files were written; commit 4fd73f3): feasibility first, then its own protocol and freeze before any unit runs; coordinator 2026-10-13 (later): the teacher stage first, as a separable staged freeze'
parents:
  - "reports/R7/R7_EXTENSIONS_DECISION_20261013.md (E2)"
  - "reports/R7/R7_D1_FULL_PROTOCOL_DRAFT_20261012.yaml and reports/R7/R7_D1_FULL_STAGED_FREEZE_20261012.yaml (DF-1..DF-11; the design mirrored here)"
  - "reports/R7/R7_40_PROTOCOL_DRAFT_20261012.yaml; R7_40A_STAGED_FREEZE_20261012.yaml (D40a-1..8, 40a_1); R7_40B_STAGED_FREEZE_20261012.yaml (40b_1..3); R7_40C_PROTOCOL_DRAFT_20261012.yaml; R7_40C_STAGED_FREEZE_20261013.yaml (40c_1..3)"
freeze_keys:
  r7_e2a_staged_freeze: "stage E2a (data stage + teacher bundles + completeness): gates slurm/r7_e2_submit.sh teacher and scripts/r7_e2_data.py data"
  r7_e2_staged_freeze: "stages E2b / E2c (cache, selectors, evaluation, readout): gates slurm/r7_e2_submit.sh rest and the readout (which also needs r7_40c_staged_freeze and r7_e2a_staged_freeze)"

purpose: >
  R7-40b trains every Qwen selector on FIT = the frozen 10,000 images (39,960 binary questions).  E2 asks whether the R7-40c conclusions
  (S1 VCS against S2 logistic, S3 direct risk and the uniform grid at fixed kept-token fractions) still hold when the identical Qwen pipeline is
  trained on D1-FULL's FIT_FULL (70,256 images, 280,787 questions), so that the cross-host statement rests on full-data selectors on both hosts
  (LLaVA: D1-FULL, claim rule DF-8).  Only the size of FIT changes.  Host, teacher, masks, CAL, training recipe, CAL rate rule, evaluation sets,
  prompts, evaluators and statistics are the frozen R7-40 ones.

scope_rules:
  - "frozen code runs unchanged (called by the E2 wrappers or imported read-only): scripts/r7_d1_40_{teacher,host,masks,cache,train,selectors,analyze}.py, r7_d1_40c_{run,plan,score}.py, r7_d1_plan20.py, r7_d1_teacher.py, r7_d1_masks.py, r7_vl_common.py, r7_d1_data.py, r7_d1full_data.py (make_plan / copy rule); E2 lives in new files only"
  - "FIT_FULL, CAL and DEV are D1-FULL's frozen manifest (outputs/R7_D1_FULL/data, sha256 c4404f7b…), whose FIT / CAL / DEV rows for the first 14,000 images are the frozen D1 manifest's (byte prefix) — the manifest R7-40a used"
  - "DEV stays sealed: E2 plans, computes, copies and reads no DEV teacher shard; R7-40c's DEV-risk read stays the first and only read of the Qwen DEV teacher records (E2-6)"
  - "nothing is selected on GQA DEV, TextVQA val or ChartQA val: rates, checkpoints and dynamic taus on CAL only (frozen R7-40b rules)"
  - "no official-test read; no timing unit (Qwen has no B*, R7-40a reference timing job 1035608; no acceleration claim)"
  - "Qwen scope of R7-40 unchanged: S1 / S2 / S3 only, no A1 / A2 ablations; an external Qwen method only as a separate host column (E1, not part of E2)"

# ------------------------------------------------------------------------------------------------------------------------------ data
data:
  manifest: >
    D1-FULL's frozen manifest, used read-only: outputs/R7_D1_FULL/data/d1_manifest.jsonl (296,762 rows, sha256 c4404f7b…, frozen by D1-FULL's
    data stage at 2026-10-12T15:58:50Z, verified by D1-FULL's own d1full_verify.json).  E2's data stage writes byte copies (sha256 re-checked)
    to outputs/R7_E2/data with E2's own shard plan.
  counts: "FIT_FULL 70,256 images / 280,787 questions (pi_yes 0.495062); CAL 2,000 / 7,989 (the frozen CAL); DEV 2,000 / 7,986 (the frozen DEV, never touched by E2)"
  r7_40a_fit_is_the_frozen_d1_fit: >
    Yes.  R7-40a ran on outputs/R7_D1/data (the frozen D1 manifest, sha256 32c72126…, and its shard plan of 250-image shards).  That manifest is a
    byte prefix of D1-FULL's; FIT-000..039 (10,000 images, 39,960 questions) and CAL-000..007 have identical image lists in both plans, and the
    frozen FIT images are the first 10,000 FIT_FULL images in manifest order (D1-FULL precheck 1035984; re-verified by E2's own precheck, see
    provenance).  R7-40a's records cover exactly FIT-000..039 + CAL-000..007 (47,949 records; R7-40a completeness job 1036189).
  class_weights: "from the training set, by the frozen rule: FIT_FULL gives w_yes 1.0099743 / w_no 0.9902208 (R7-40b: 1.0098560 / 0.9903346); the frozen trainer reads them from the manifest meta (E2-3)"

# ------------------------------------------------------------------------------------------------------------------------------ stage E2a (teacher)
stage_E2a_teacher:
  freeze_key: r7_e2a_staged_freeze
  questions: >
    FIT_FULL minus what R7-40a's records already cover: shards FIT-040 … FIT-281 = 242 shards, 60,256 images, 240,827 questions (outputs/R7_D1_FULL/
    data/plan_dryrun.json 'reuse_fit'; re-derived by E2's precheck).  CAL is never recomputed; DEV is never planned.  If the reuse rule fails
    (E2a-2), FIT-000..039 are recomputed too: 282 shards / 70,256 images / 280,787 questions.
  reuse_rule_and_its_verification: >
    The analogue of D1-FULL's DF-2.  R7-40a's FIT-000..039 records are reused if and only if (1) the static check passes — the D1-FULL manifest is
    frozen with sha256 c4404f7b… and D1-FULL-verified; the frozen D1 manifest (32c72126…) is its byte prefix; the frozen CAL / FIT shard image
    lists equal D1-FULL's; D1-FULL's plan equals make_plan(reuse_fit=True); for every R7-40a CAL / FIT shard: the .jsonl sha256 equals its done
    record, present == expected == the manifest's questions of its images, no duplicate, no skipped image, made on an NVIDIA L40S; every record's
    image / C / role / GQA types equal the manifest row, n_vis = rows × cols, budgets = round(f·N), random and grid orderings and their log-
    probabilities re-derived by the current mask code equal the record, the qsim ordering is a permutation with its recorded digest, every
    probability pair is well formed; the teacher code is clean at HEAD and last changed before the first R7-40a shard; the vl_baselines
    FREEZE.txt and the Qwen checkpoint files predate it; R7-40a's and E2's bundle lines pass no chunk / batch option (same teacher settings) —
    and (2) the GPU replay passes: the first chunk (16 images) of FIT-000 and of FIT-001 recomputed with the frozen teacher on an L40S equals
    R7-40a's records bit for bit (E2 smoke).  Otherwise FIT-000..039 are recomputed by E2 bundles (5 more).  CAL-000..007 are always R7-40a's
    records (R7-40b's selection set and the pre-registered CAL readout): a failed CAL check stops the data stage (coordinator decision).
    Reused files are copied (sha256 re-checked; an existing different file is never overwritten) into outputs/R7_E2/teacher.
  teacher_code_and_env: >
    The frozen R7-40a teacher, scripts/r7_d1_40_teacher.py bundle, unchanged (blob e9320ea1; with r7_d1_40_host.py 86f06d76 and r7_d1_40_masks.py
    52a6d54c, last changed in 8c5c9d8 at 2026-10-12T11:00:21Z; r7_d1_teacher.py b95e9aca, r7_d1_masks.py 62e8bcc7, r7_vl_common.py 954b3b23), in
    /projects/EEG-foundation-model/yinghao/envs/vl_baselines (torch 2.9.0 cu128, transformers 4.57.6), Qwen2.5-VL-7B-Instruct bf16 / SDPA with the
    R7-20 pixel bounds, python -I.  Per question the frozen 14 prefill passes (full, 3 mechanisms × 4 nested fractions, text-only), first-token
    yes / no probabilities; 16 images per chunk; prefill batches of at most 16,384 tokens / 64 sequences (the defaults every R7-40a bundle used);
    the per-bundle bit-identical replay of the first chunk (determinism sentinel) and the coverage guard as frozen; per-question resume;
    images from the extracted GQA folder only (MissingImage stops the unit).  Wrapper: slurm/r7_e2_gpu.sbatch bundle <id> (one line, no option).
  launch_gates: >
    Driver (slurm/r7_e2_submit.sh teacher): the top-level key r7_e2a_staged_freeze; a passing probe report outputs/R7_E2/smoke/probe/probe_report.json
    (the frozen R7-40a probe rerun in the E2 smoke with the frozen rules S4 = rate:0.9, S1 = same_gpu, D40a-1 / D40a-2); the replay file
    outputs/R7_E2/smoke/reuse_replay.json.  Data stage (CPU job, refuses without the key): verification, static check, reuse decision, copies,
    E2's shard plan and teacher lines; marker data/data_ready.json.  Each bundle (frozen gates): manifest frozen with an unchanged sha256, the
    passing probe report, no DEV shard (never --allow-dev), every image file present.
  shard_plan_and_units: >
    D1-FULL's 250-image shards and 8-shard bundles, by D1-FULL's make_plan imported unchanged (scripts/r7_d1full_data.py): with reuse, the 31
    bundles f000 … f030 of D1-FULL's own plan (f000–f029: 8 shards ≈ 7,990 questions; f030: FIT-280 (1,000 questions) + FIT-281 (6 images, 24
    questions)); without reuse 36 bundles.  One line per bundle: 'sbatch --parsable --job-name=r7e2t_<b> --partition=L40S --exclude=node51,node60
    --time=02:00:00 slurm/r7_e2_gpu.sbatch bundle <b> #MARK outputs/R7_E2/teacher/bundle_<b>.done.json'.  Single writer per shard file; a unit is
    resubmitted (at most twice) only after its job left the queue without its marker.
  completeness: "the frozen R7-40a tool (scripts/r7_d1_40_analyze.py complete) on E2's teacher dir and data dir: all 290 CAL / FIT shards complete, per-role totals equal the manifest (CAL 7,989, FIT 280,787), sha256 c4404f7b… unchanged -> teacher/r7_40a_completeness.json"
  hardware: >
    L40S only (D40a-4: one GPU class for the probe and every Qwen teacher record; all 56 R7-40a / R7-40c teacher shards were made on L40S).  D40a-4
    is an R7-40a decision, so it does not bind E2 formally, but E2 mixes new records with the reused R7-40a ones in one training set and the
    replay rule is defined on L40S; keeping L40S is the consistent choice (E2a-3).  H100 would be ≈ 2× faster per question (derived, never
    measured for this teacher) and would mix numeric classes.
  time_limits: "bundle 2 h (≈ 3 × the expected 40 min: 35 min of teacher compute + ≤ 9 min staging / load); data stage and completeness: CPU, 2 h limit (expected minutes)"
  cost: "≈ 20 GPU-h on L40S for 240,827 questions (feasibility); + ≈ 3.3 GPU-h only if FIT-000..039 must be recomputed; wall ≈ 2–3 h with ≈ 10–15 free L40S"
  outputs: "outputs/R7_E2/{data, teacher, lines, smoke}: ≈ 0.56 GB of new records (2.34 KB per question) + verified copies of 48 R7-40a shards (0.11 GB) + the manifest copy (0.07 GB)"
  smoke_before_the_freeze: >
    GPU (coordinator): sbatch --job-name=r7e2_smoke --partition=L40S --exclude=node51,node60 --time=01:00:00 slurm/r7_e2_gpu.sbatch smoke —
    one host load: the frozen probe (S0–S7) -> smoke/probe/probe_report.json, then the replay of the first chunks of FIT-000 / FIT-001 ->
    smoke/reuse_replay.json (expected ≈ 20 min: the R7-40a probe job 1035725 took 12 min including a 489-s load).  CPU (optional, done once):
    slurm/r7_e2_cpu.sbatch precheck (verification + static check, dry run).
  launch: "after the freeze: cd /home/infres/yinwang/CS_QMI/ssl_pilot && nohup setsid bash slurm/r7_e2_submit.sh teacher >/dev/null 2>&1 &   (log slurm_logs/r7_e2_submit.log; stop by PID)"

# ------------------------------------------------------------------------------------------------------------------------------ stage E2b (cache, selectors)
stage_E2b_cache_selectors:
  freeze_key: r7_e2_staged_freeze
  feature_cache: >
    The frozen R7-40b cache script (scripts/r7_d1_40_cache.py d1_40) unchanged on E2's data dir: merged Qwen tokens -> PCA 3584 -> 512 (64 seeded
    tokens per image, streaming fp64 covariance, eigh) -> fp16 features of every FIT_FULL and CAL token, Qwen ids of the raw questions, the frozen
    bf16 embedding table.  --max-images sets the PCA images (E2-1): 70,256 (fitfull, default: the frozen 'fit on FIT' rule with FIT = FIT_FULL)
    or 10,000 (frozen10k: the frozen FIT images, i.e. R7-40b's PCA image set; bit-identity with R7-40b's pca.pt is checked and reported).  One
    job on RTX6000PRO,H100,L40S (40b_1), independent of the teacher, so it may run while the teacher bundles run.  The frozen script is one pass
    (not resumable); it holds the features in host RAM (≈ 2 × 22.8 GB at the concatenation) within --mem 96G.  A CPU check compares its outputs
    with E2's manifest (role image lists and order, token sums, offsets, question ids, PCA image count, grids within 64 × 64).
  selectors: >
    The frozen R7-40b trainer (scripts/r7_d1_40_train.py train) unchanged: S1 vcs, S2 logistic, S3 direct; 20,000 phase-A steps of 64 questions × 4
    of their 12 masks, CAL Spearman(r, h) selection every 1,000 steps, 5,000 phase-B gate steps, dynamic taus on CAL; exact micro-batching (D40b-2);
    64 × 64 position tables (D40b-4); nominal fractions (D40b-5).  Rate search re-run at full scale with the frozen rule (OPEN-R740-3): seed 0 × lr
    {1e-4, 3e-4} × 3 objectives (6 units) -> r7_d1_plan20.choose (higher selected CAL Spearman; tie within 1e-4 -> 3e-4; the E2 choice may differ from
    R7-40b's vcs 3e-4 / logistic 1e-4 / direct 3e-4) -> seeds 1-2 × 3 objectives at the chosen rates (6 units).  12 units, no ablations.
  data_scale_consequence_disclosed: "the recipe fixes steps, not epochs: R7-40b saw each FIT question ≈ 32 times (20,000 × 64 / 39,960), E2 ≈ 4.6 times (20,000 × 64 / 280,787); the scale contrast measures more distinct tuples at an equal optimisation budget (E2-4)"
  hardware: "RTX6000PRO,H100 only (40b_2 / 40b_3; FIT_FULL static data alone ≈ 25 GiB on the GPU); PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True (E2-11); --time 4.5 h (≈ 3 × 1.1–1.45 h); resumable per unit"

# ------------------------------------------------------------------------------------------------------------------------------ stage E2c (evaluation, analysis)
stage_E2c_evaluation_and_analysis:
  freeze_key: r7_e2_staged_freeze
  stage_0: "the frozen R7-40c check (scripts/r7_d1_40c_run.py check) with E2's units, PCA and lr_choice: sets vs build summary, images, grids within 64 × 64, the 9 units' files and CAL taus; writes E2's 50 core configs (the scorer's list)"
  rows: >
    E2-12 (coordinator's direction, default ROWS=selectors): E2 generates its 45 selector rows (S1 / S2 / S3 × seeds 0-2 × 0.125 / 0.25 / 0.5 / 0.75 and S1
    dynamic × seeds × 3 CAL operating points) plus the full row as an in-job anchor; R7-40c's selector-independent rows (full, uniform grid ×
    4) are reused after verification.  Option ROWS=core: all 50 core rows rerun (+4 rows per benchmark, ≈ +0.7 GPU-h), every primary contrast within-job.
  reuse_of_r7_40c_rows_and_its_verification: >
    R7-40c's uniform-grid rows enter E2's primary family (S1 − grid) iff (static) every R7-40c and E2 quality shard marker carries the same set
    sha256, equal to the set file and the D1-30 build summary; every marker says NVIDIA L40S; the runner code (r7_d1_40c_run.py, r7_d1_40c_plan.py,
    r7_d1_40_host.py, r7_d1_40_masks.py, r7_d1_40_selectors.py, r7_d1_selectors.py, r7_d1_30_run.py, r7_d1_masks.py, r7_vl_common.py) has the same
    blobs at HEAD as at 4174400 (execution note 40c_3) and is clean; R7-40c's completeness passes; and (empirical) E2's in-job full row equals
    R7-40c's full row on every item of the three benchmarks (answer, kept and visual-token counts, generated length: the same chunks, batches,
    GPU class and code give bit-identical greedy decoding).  Then the four grid rows are copied (sha256-checked) into E2's prediction dir;
    otherwise the driver stops for a coordinator decision (rerun with ROWS=core in a fresh eval dir, or disclosed reuse).
  quality_units: "12 shards with the D1-30 / R7-40c sharding (GQA 6, TextVQA 4, ChartQA 2), L40S only (R7-40c decision 7), the frozen runner with E2's selectors and PCA, prompts / generation / batch 32 / chunk 32 as R7-40c; time limits GQA 1 h 40, TextVQA 3 h 45, ChartQA 2 h 10 (≈ 3 ×)"
  timing: "none (E2-13): Qwen has no B*, the primary basis is fixed fractions; the sel rows share R7-40c's architecture latency; E2's dynamic-row latency is not measured (secondary only, no acceleration claim)"
  dev_risk: "none (E2-6, = D1-FULL's DF-6): R7-40c's DEV-risk read was the first and only read of the sealed Qwen DEV teacher records"
  primary: >
    R7-40c's family unchanged (E2-5): S1 − S2, S1 − S3 and S1 − uniform grid × GQA DEV / TextVQA val / ChartQA val at the fixed fractions 0.25 /
    0.5 / 0.75 (seed mean of per-item scores, paired), image / chart-grouped paired bootstrap (2,000, seed 0), two-sided p with +1 correction,
    Holm over the 9 contrasts per fraction point — computed by the frozen R7-40c scorer on E2's rows (no timing dir, --anchor none).
  claim_rule_E2_8: >
    The analogue of D1-FULL's DF-8 across the two Qwen scales: a Qwen D1 claim is made only where the 10k scale (R7-40c) and the full scale (E2)
    agree in sign and both pass their own Holm-corrected primary tests (alpha 0.05); the full-scale numbers are the headline; any disagreement
    is reported as scale-dependent.  The cross-host statement (LLaVA D1-FULL vs Qwen E2, each under its own conjunction rule) stays descriptive:
    no pooling, no cross-host test; it rests on S1 − S2 and S1 − S3 (S1 − grid is Qwen's own primary slot, R7-40c decision 5).
  scale_contrast_descriptive: "full − 10k per objective (S1, S2, S3) at each fixed fraction incl. 0.125: seed-mean per-item difference (seed i vs seed i), the shared paired bootstrap; S1 dynamic rows: quality and realised kept fraction per scale; no multiplicity adjustment, no claim"
  secondaries: "every frozen R7-40c secondary computed by its scorer on E2's rows (fixed-fraction table, retention, A3 dynamic − fixed, preserve / correct, dynamic fraction distribution, GQA types, ChartQA human / augmented, integrity); none enters a claim"
  readout_tool: "scripts/r7_e2_score.py (SparseVLM env; refuses without r7_40c / r7_e2a / r7_e2 keys; never overwrites): the frozen R7-40c scorer on E2's rows, then the claim table and the scale contrast -> eval/results/{r7_40c_results, e2_claims}.{json,md}; run by the coordinator after the driver's done line"
  official_test: "none (no official-test read in E2; a test column would need a new owner approval)"

# ------------------------------------------------------------------------------------------------------------------------------ feasibility
