      ≈ 20 GiB headroom on an H100 NVL (93.1 GiB) and ≈ 22 GiB on an RTX PRO 6000 (95.1 GiB): fits; without it ≈ 85 GiB (D1-FULL +16.2 GiB) -> ≈ 8 GiB
      headroom on H100 NVL.  An L40S (44.4 GiB) cannot hold a unit.  To be confirmed by the memory smoke (slurm/r7_e2_sel.sbatch memsmoke) before the E2 freeze.
