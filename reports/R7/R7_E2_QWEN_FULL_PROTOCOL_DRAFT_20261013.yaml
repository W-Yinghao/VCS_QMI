  new_teacher_questions:
    value: "240,827 questions / 60,256 images / 242 shards (FIT-040 … FIT-281) in 31 bundles; R7-40a's FIT (39,960 q, FIT-000..039) is exactly D1's frozen FIT = the first 10,000 FIT_FULL images; + CAL 7,989 reused"
    source: "outputs/R7_D1_FULL/data/plan_dryrun.json and d1_shards.json; D1-FULL draft data.verification (precheck 1035984); R7-40a run on outputs/R7_D1/data (slurm/r7_d1_40_gpu.sbatch bundle line); E2 precheck (provenance)"
  teacher_seconds_per_question_L40S:
    value: "0.2655 s (55,935 questions in 14 bundles; per bundle 0.259–0.270 s); staging + load 14–519 s per job (mean 242 s)"
    source: "slurm_logs r7d40t_b000..b011 (jobs 1035835–1035846, node50 / node57) and r7d40cd_b012 / b013 (jobs 1036855 / 1036856, node39 / node50): Σ shard seconds / Σ questions; load = wall − Σ shard seconds"
