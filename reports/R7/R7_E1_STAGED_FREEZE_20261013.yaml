execution_note_e1_1: >
  2026-10-13 ~12:50 UTC, coordinator (D-E1-7): the E1 readout is frozen in this commit, before any E1 production unit ran and before any E1
  prediction existed: scripts/r7_e1_readout.py, tests/test_r7_e1_readout.py, slurm/r7_readout_e1_cpu.sbatch (named outside the slurm/r7_e1_*
  glob so the frozen E1 code hash 519635f47ebbe9c0 stays unchanged); stub tests 6 / 6 in the main and SparseVLM environments (job 1037562).
  Readings of the design it implements: R7-40c's rows are recomputed from R7-40c's predictions with the same Bench40 on the same items and
  bootstrap weights, and must equal R7-40c's committed results file (any difference stops); S1 / S2 / S3 cells are seed means with a bootstrap
  interval of the mean and the per-seed values; the f = 1 row shows R7-40c's batched full and full_official next to the E1 anchors; the env
  diagnostic (ext:<method>:1 vs full_official) reports both qualities, the paired difference with its interval, the identical-answer
  fraction and differing items, without a p-value; retention is a point estimate; no difference, test or p-value is computed between any E1
  column and S1 / S2 / S3 / grid; TextVQA is scored in the SparseVLM environment as R7-40c; a one-method readout exists only for a disclosed
  gap under D-E1-4 and would need its own execution note.
