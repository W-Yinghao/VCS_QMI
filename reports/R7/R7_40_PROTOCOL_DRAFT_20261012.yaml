host_interface_verified:              # read in the installed transformers 4.57.6 code, then checked by CPU tests and the GPU probe (provenance)
  image_processor: "AutoProcessor resolves Qwen2VLImageProcessor to the FAST torchvision processor (FORCE_FAST_IMAGE_PROCESSOR), the class R7-20 used; smart_resize to multiples of 28 within [256·28², 1280·28²]; patches flattened as (t, H/28, W/28, 2, 2) so every 2 × 2 merge group is contiguous"
  token_merger: "model.model.visual: patch embed -> window reordering -> 32 blocks (full attention at 7 / 15 / 23 / 31; SDPA runs every window / image separately) -> PatchMerger (RMSNorm, 4 × 1280 = 5120 -> 5120 -> 3584 MLP over each 2 × 2 group) -> inverse window reordering.  Output per image: N = (H/28)·(W/28) merged tokens × 3584 (= the LLM width), raster order over the rows × cols merged grid"
  selection_point: "after the merger, before the LLM: kept merged tokens spliced in raster order between the chat-template text before / after the image placeholder; the selector never reads the LLM"
  position_ids: >
    The official get_rope_index on the FULL sequence: text before the image t = h = w = position; merged token (r, c) gets (s, s + r, s + c)
    (s = the image's first position; temporal index 0 for images); text after the image restarts at s + max(rows, cols).  Pruned sequences keep
    the full sequence's ids column by column (kept visual tokens keep their (t, h, w) ids, every text token its position); decoding continues at
    max position + 1 (= current length + the full sequence's rope delta) on all three axes.  The text model uses 3-row ids for the rotary
    embedding only; its causal mask comes from the 2-D attention mask and the cache positions (sequence order), never from position values
    (packed-sequence detection needs a 4-row id tensor or no mask), so gaps in the ids are well defined.
  token_counts: "N = rows · cols per image, 256 ≤ N ≤ 1280 by the pixel bounds; R7-20 GQA fixture: 102 images, mean 307, median 280, range 260–999 (6 % above 600: 609 / 999); TextVQA fixture mean 971.  Probe S0: on all 200 GQA fixture items the spliced ids equal the processor's input_ids, N = t·h·w / 4 equals the image-token count and the R7-20 count, and the image processor's pixel values equal the processor call's bit for bit"
  prompts: "Qwen chat template (system 'You are a helpful assistant.' added by the shipped template), user content [image, question + '\\nAnswer the question using a single word or phrase.'] — the frozen D1-10 teacher prompt and the R7-20 Qwen fixture prompt; text-only pass: user content [text] only, positions 0..L−1"
  generation: >
    Shipped generation config: do_sample true, temperature 1e-6, repetition_penalty 1.05, eos [151645, 151643], pad 151643.  R7-20 called
    generate(do_sample=False): greedy WITH the 1.05 repetition penalty over the prompt + generated ids.  The spliced decode loop
    (scripts/r7_d1_40_host.py QwenCore.generate) reproduces it (fp32 penalised logits, argmax, finished rows emit pad, stop when every row has
    emitted an eos id or at max_new_tokens; min_new_tokens masks the eos ids): CPU test against HF generate on a tiny random Qwen2.5-VL (single
    and left-padded batches, normal and forced length), GPU sentinels S5 / S5b on the real model.
  yes_no_ids: "R7-20 lists: yes [7414, 9454, 9693, 9834, 14004], no [902, 2152, 2308, 2753, 8996]; P(yes) / P(no) from the raw fp32 first-step logits"
  budgets: "fractions f of each image's own N: k(f, N) = max(1, floor(f·N + 1/2)), f ∈ {0.125 (stress), 0.25, 0.5, 0.75}; f = 1 is the full pass (coordinator, task statement 2026-10-12)"

