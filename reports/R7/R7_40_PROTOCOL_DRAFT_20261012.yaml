open_decisions:
  before_the_40a_freeze:
    D40a-1_S4_yes_no_mass: >
      BLOCKING.  The frozen S4 sentinel ('full-pass yes / no mass ≥ 0.9 on every binary probe item') fails on Qwen by construction: 4 of 68 binary
      fixture items get an object word as the first token ('giraffe', 'bus', 'horse'; mass 0.05–0.50), all GQA logical 'either X or Y'
      questions (visible in the R7-20 Qwen answers before any R7-40 code ran).  Options: (a) S4_RULE=rate:0.9 — keep the frozen prompt, the frozen
      primary (every item, p̃ renormalised) and the pre-declared mass ≥ 0.9 secondary, plus the new low-mass-by-type QC (the rate was chosen after
      seeing the fixture: disclose); (b) keep 'min' — 40a cannot start; (c) another teacher prompt for binary questions — a different teacher than
      D1-10 and than the D1-30 pinned prompts (not recommended).
    D40a-2_S1_reference: >
      BLOCKING.  The frozen S1 reference is the R7-20 values, computed on an H100 NVL; bf16 differences between GPU types alone reach 0.054
      (S1d on L40S), so the probe fails 'r720' off the H100 NVL although the spliced path is exact (S1b 0.0).  Options: (a) S1_RULE=same_gpu —
      the frozen threshold against the official path on the probe's own GPU (measured 0.019 on L40S, 0 flips; thin margin), S1d reported; (b) keep
      'r720' and pin the probe to the H100 partition (PROBE_PARTITION=H100: same GPU model as R7-20; S1 then ≈ batching noise ~0.02, also thin;
      both H100 NVL nodes are now held by 1-day jobs of other users); (c) a bf16-specific threshold (post hoc).
    D40a-3_teacher_batching: "batched prefill (the frozen D1-10 implementation; measured noise vs batch 1: median |ΔP| 3e-7, 2.1 % of passes > 0.02, 0.3 % flips, p99 |ΔT| 0.058) vs every pass at batch 1 (each pass = the official computation on its GPU; +72 % teacher compute, ≈ +2.7 GPU-h on L40S) — code change needed only for (b): run_items(max_seqs=1)"
    D40a-4_teacher_hardware: "TEACHER_PARTITION: mixed RTX6000PRO / H100 / L40S (as D1-10's mixed H100 / L40S; b and a of one question always come from the same job and GPU) vs one class (e.g. L40S: free capacity, peak 18.9 GB) so that all teacher records share bf16 kernels; RTX PRO determinism (bit-identical replay) is still to be confirmed by job 1035607"
    D40a-5_DEV_teacher_passes: "deferred to R7-40c (implemented: the code refuses DEV bundles without --allow-dev; the strongest seal) vs run now with 40a and kept sealed (the LLaVA D1-10 precedent)"
    D40a-6_new_sentinels: "S0 (host interface), S1b (same-GPU batch-1 |ΔP(yes)| ≤ 1e-3), S5b (same-GPU batch-1 generation ≥ 98 %), S6 (rotary ids), S7 (all-kept == full) in the launch gate, beyond the frozen S1–S6"
    D40a-7_B_star: "Qwen's B* comes from the pending reference-node timing (job 1035608) under the rule and the pre-declared procedure (pool of batches instead of D1-10's single batch × 3 repeats, because N varies per image); indicative L40S value B* = 16, not LLaVA's 4 — R7-50's outline assumes B* = 4 for the Qwen timing rows and should read 'Qwen's B*'"
    D40a-8_freeze_mechanics: "freeze keys 'r7_40a_staged_freeze' / 'r7_40b_staged_freeze' looked up in reports/R7/R7_D1_PROTOCOL_FROZEN_20261012.yaml (or a separate frozen R7-40 file via PROTOCOL); record the launch parameters S4_RULE, S1_RULE, PROBE_PARTITION, TEACHER_PARTITION in the freeze; the driver's CAP default stays 27 (submits while my normal-QOS count < 27, as the frozen drivers)"
    OPEN-R740-8: "confirm: if no B* on Qwen, the 40c primary is quality at fixed fraction and no acceleration is claimed"
