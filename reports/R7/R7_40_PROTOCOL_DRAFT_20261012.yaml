    fallback (unlike the frozen LLaVA r7_d1_teacher.ImageSource): scripts/r7_d1_40_teacher.ExtractedImageSource raises MissingImage with a clear
    message and the unit stops (a missing file is never reason-coded as a skip); the feature cache uses the same source; a test asserts that no
