    images are present (file names only; nothing decoded).  Unreadable files (decode errors) stay reason-coded skips counted against coverage.
  teacher: "b = T(full), a = T(masked), T = 2 p̃ − 1, p̃ = P(yes) / (P(yes) + P(no)) of the first generated token (prefill only); class weights from FIT (w_yes 1.0099, w_no 0.9903)"
  masks:
    trials_per_question: "3 fixed trials, one per mechanism (frozen D1-10 rule), on the image's rows × cols merged grid"
    random: "uniform random ordering of the N tokens; log P(set) = −log C(N, k)"
    grid: >
      the four 2-stride lattices in a random order, the first split into the checkerboard of its 2 × 2 coarse grid (first) and the rest, random
      order inside each block (frozen D1-10 code); on 24 × 24 every budget is a block boundary and log P = −log 8 / 4 / 6 / 4 is recovered (test);
      on other grids a budget can end inside a block, whose kept part is a uniform random subset of that block; log P(set) exact by enumeration
      of the 48 configurations (test: brute force on 3 × 4, 5 × 5, 2 × 7 at every k)
    qsim: "Plackett–Luce (Gumbel top-k) on z-scored cosine(merged visual token, mean Qwen input embedding of the raw question tokens); log P of the ordered prefix"
    nesting: "kept set at f = prefix of the trial's ordering, k non-decreasing in f: A_0.125 ⊂ A_0.25 ⊂ A_0.5 ⊂ A_0.75 ⊂ B"
    seeds: "sha256('r7-40/d1-mask/<mechanism>/<qid>') with the D1 seed 20261012 (a stream separate from the LLaVA masks); qsim orderings stored (uint16 base64), random / grid re-derivable and digest-checked"
  passes_per_question: "14 (1 full + 3 × 4 masked + 1 text-only), prefill only; frozen D1-10 implementation: right-padded batches of ≤ 16,384 tokens / ≤ 64 sequences sorted by length (OPEN D40a-3: batch 1); one vision pass per image (chunks of 16 images)"
  record: "qid, image_id, role, C, GQA types, n_vis, grid [rows, cols], budgets {f: k}, text_tokens, full / text (P(yes), P(no)), masked {mech: {f: pair}}, logp, order digests, qsim order (≈ 2.3 KB per question)"
