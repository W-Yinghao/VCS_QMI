    RTX PRO 6000 / H100 NVL expected faster (RTX smoke pending).
  driver: "S4_RULE=… S1_RULE=… PROBE_PARTITION=… TEACHER_PARTITION=… nohup setsid bash slurm/r7_d1_40_submit.sh 40a >/dev/null 2>&1 &  (after the freeze key 'r7_40a_staged_freeze' is in the protocol file; the four parameters as frozen)"

# ------------------------------------------------------------------------------------------------------------------------------ 40b
R7_40b_selectors:
  purpose: "D1-20 on Qwen with the frozen recipe: S1 VCS, S2 logistic, S3 direct risk; symmetric 2-learning-rate seed-0 search per objective, then seeds 1–2"
  feature_cache: >
    One GPU job (scripts/r7_d1_40_cache.py d1_40; pixels and question text only — no label, no teacher output): merged visual tokens (official
    processor + tower + merger, bf16) -> PCA 3584 -> 512 fitted on FIT images only (all 10,000, 64 seeded tokens each,
    seed sha256('r7-40/d1-pca/<imageId>'); streaming fp64 covariance, eigh; explained variance recorded) -> fp16 features of every token, a
    role's images concatenated (feats_<role>.npy [Σ N_i, 512] + offsets / N_i / grid); FIT and CAL only (DEV at R7-40c); Qwen tokenizer ids of
    the raw question (no special tokens) and the frozen bf16 input-embedding table.  Images from the extracted folder only.
  architecture: >
    The frozen D1-20 selector (scripts/r7_d1_selectors.py, imported unchanged) with two host-interface changes (scripts/r7_d1_40_selectors.py):
    question tokens: Qwen input embedding (3584) -> Linear(3584, 512); visual tokens: PCA-512 -> Linear(512, 512) + learned ROW table[r] + learned
    COLUMN table[c] (64 × 512 each, N(0, 0.02²); factorised positions replace the 576 × 512 table of the 24 × 24 grid) + type.  Visual keys are
    padded to the batch maximum with the additive key bias −1e9 (the frozen per-key bias mechanism); gates, relaxed and hard top-k act on valid
    tokens only.  A test shows that on a constant 4 × 4 grid with the frozen table set to row + column, the adapter reproduces the frozen
    encoder, every objective's loss and its gradients.  Images whose grid exceeds 64 × 64 stop the unit (FIT / CAL maxima recorded by the cache).
  recipe: >
    Frozen D1-20: phase A 20,000 steps of 64 questions × 4 of their 12 masks, AdamW wd 0.01, 1,000-step warm-up then cosine, objectives S1 vcs
    −[J(T_B) + J(T_A)] / S2 balanced logistic on 2f / S3 class-weighted MSE to h; every 1,000 steps CAL Spearman(r(K), realised h) over all CAL
    (question, mask) pairs selects the state (same rule for S1–S3, disclosed asymmetry: it is S3's target); native criterion logged (secondary,
    never used); phase B 5,000 gate steps, budget fraction drawn uniformly from {0.125, 0.25, 0.5, 0.75}, relaxed top-k (Gumbel, threshold midway
    between the k-th and (k+1)-th perturbed valid logits), tau cosine 1 -> 0.1, AdamW 3e-4, final state; soft / hard gap on CAL; dynamic
    rule = smallest f in {0.125, 0.25, 0.5, 0.75, 1} with r(top-k) ≤ tau, tau fixed on CAL by bisection for mean kept fraction 0.25 / 0.5 / 0.75
    (nominal fractions); bit-exact resume; explicit fp32 attention.  A unit is complete only when its marker <tag>.done.json is written, after
    the CAL dynamic taus (a unit stopped between the checkpoint and the taus is finished on rerun, not skipped).
  exact_micro_batching: >
    Implementation, not recipe: with variable N the longest image of a step would pad all 320 sequences (≈ 6 % of GQA images have ≥ 609 tokens).
    A step's 64 questions are sorted by length and cut into contiguous micro-batches by an exact dynamic programme that minimises the padded
    compute Σ n·s·(L + γL²) + a per-batch overhead under the memory cap n·s·L² ≤ the frozen LLaVA step's 320 × 606²; each micro-batch adds its
    terms with the step's GLOBAL normalisers (Σ w for the full pass, 4 Σ w for the masked ones), so loss and gradient equal the single-batch ones
    (test: S1–S3, any partition, fp32 precision, dropout off); only the dropout draws differ.  CAL evaluation, soft / hard gap and dynamic tau are
    grouped the same way (cap 64 × 13 × 606²).
  learning_rate: "frozen OPEN-6 rule re-run on Qwen (OPEN-R740-3): lr {1e-4, 3e-4} × seed 0 per objective; the higher selected CAL Spearman wins, a tie within 1e-4 -> 3e-4 (scripts/r7_d1_plan20.choose imported unchanged); seeds 1–2 at each objective's chosen rate"
  units: "1 cache job; stage 1: 6 units (3 objectives × 2 rates × seed 0); choice (CPU); stage 2: 6 units (3 objectives × seeds 1, 2) = 12 training units"
  hardware: "default RTX6000PRO / H100 (D1-20 execution note E5: one hardware class); the cap-bound worst case measured 25.6 GB on an L40S, so L40S would also fit (OPEN D40b-3); cache job any of the three"
  outputs: "outputs/R7_D1/r7_40/selectors/<objective>_lr<lr>_s<seed>.{pt,json,resume.pt,done.json} — evals, selected step, native secondary, soft / hard gap, dynamic taus, timing, peak memory"
  smoke_results: >
    Code checks on the 68 fixture probe records standing in for FIT and CAL (not results).  L40S job 1035653 (final grouping): CUDA fp32 vs CPU
    fp64 with padding — relative errors ≤ 5.0e-6 (phase-A loss / gradients, phase-B gate gradients, non-zero); all three objectives train
    (CAL selection, native criterion, soft / hard gap per fraction, dynamic tau 0.50 at the 0.5 target); 0.284 s per phase-A step (≈ 5
    micro-batches), 3.4e-4 s per CAL pair, 0.070 s per phase-B step, peak 7.1 GB on the fixture; worst-case memory probe (64 questions on
    1,280-token images, every micro-batch at the cap): 25.6 GB, no OOM on the 44-GB L40S.  The earlier greedy cap-filling grouping (job 1035633)
    took 0.738 s per step and 32.4 GB (superseded).  RTX PRO 6000 selector smoke: job 1035629 queued (outputs/R7_D1/r7_40/train_smoke/NVIDIA_RTX_PRO_6000_Blackwell_Server_Edition/).
  cost: >
    Per unit: 20,000 × 0.284 s + 20 evaluations × 95,868 CAL pairs × 3.4e-4 s + 5,000 × 0.070 s ≈ 1.86 GPU-h on L40S; RTX PRO 6000 ran the
    frozen D1-20 step ≈ 1.95× faster than L40S, so ≈ 1.0 GPU-h on the default hardware class (to be confirmed by job 1035629).  12 units ≈ 12
    GPU-h (RTX / H100) or ≈ 22 GPU-h (L40S); cache ≈ 22,000 image passes × ≈ 0.1 s + load ≈ 0.8 GPU-h.  The fixture's length mix matches GQA's
    (mean 319 selector tokens, max 1,009); real FIT questions are slightly longer.
  driver: "SEL_PARTITION=… CACHE_PARTITION=… nohup setsid bash slurm/r7_d1_40_submit.sh 40b >/dev/null 2>&1 &  (after 'r7_40b_staged_freeze'; refuses unless 40a is complete)"

