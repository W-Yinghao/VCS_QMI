      job 1035607 queued behind the D1-20 stage-2 units (results will be in outputs/R7_D1/r7_40/smoke_rtx/).
    batching_noise_measured: >
      L40S (job 1035635), all 2,800 passes of the 200 fixture questions, batched teacher vs every pass at batch 1 on the same GPU: median
      |ΔP(yes)| 3e-7, max 0.041, 59 passes (2.1 %) above 0.02, 9 yes / no argmax flips (0.3 %), mean |ΔT| 0.0077, p99 0.058, max 0.124.  Batch 1
      costs 0.486 s / question against 0.283 batched (+72 %).  (LLaVA, fp16: S1 0.0038.)
  latency_regime:
    rule: >
      Frozen D1 latency_regime rule, re-applied on Qwen (plan R7-40a): B* = the smallest batch size in {1, 4, 16, 32} at which uniform-grid 25 %
      reduces the per-item total latency (vision + selection + prefill + 8 forced new tokens) by at least 25 % relative to 100 %.  If no batch
      size qualifies, Qwen reports "no LLM-side latency saving in any tested regime", its primary endpoint becomes quality at fixed kept-token
      fraction, and no acceleration is claimed (pre-declared; OPEN-R740-8).
    reference_gpu: "NVIDIA H100 NVL on nodesumo01 (--partition=H100 --nodelist=nodesumo01); the timing code refuses another GPU"
    procedure: >
      Pre-declared here before the Qwen timing smoke (scripts/r7_d1_40_teacher.py timing): the R7-20 GQA fixture items in file order; for B in
      {1, 4, 16, 32}, consecutive batches of B over the first 64 items (B = 1) or the first 192 items (B ≥ 4; 48 / 12 / 6 batches); for each kept
      fraction f in {1, 0.75, 0.5, 0.25, 0.125} of uniform-grid tokens, one warm-up batch (not recorded), then per batch, CUDA-synchronised:
      vision = image processor (CPU) + vision tower (images opened and decoded before the clock), select = grid ordering + gather + embedding
      assembly + position ids, prefill = a separate prefill-only pass (TTFT), llm = prefill + 7 decode forwards (8 forced new tokens,
      min_new_tokens = max_new_tokens = 8, repetition penalty as shipped).  Per-item total = (vision + select + llm) / B per batch; median over
      batches.  Saving(B) = 1 − median total at 25 % / median total at 100 %.  The total without 'select' (the D1-10 smoke's vision + prefill + 8
      decode) is reported alongside; the rule uses the total with 'select'.  Why batches over a pool instead of D1-10's one batch × 3 repeats:
      Qwen's N varies per image (260–999 on the fixture), so one batch of B = 1 would time one image's N.
    smoke_result: >
      PENDING on the reference GPU: job 1035608 (nodesumo01) is queued — both nodesumo01 GPUs (and node53's four H100 NVL) are held by other
      users' 1-day jobs; it writes outputs/R7_D1/r7_40/timing/timing_report.json (rows, savings, B_star) with the frozen code.  Indicative only
      (job 1035634, L40S node50, NOT the reference GPU, --allow-any-gpu, outputs/R7_D1/r7_40/timing_l40s_indicative/): per-item totals at 100 /
      25 % = 258 / 248 ms (B = 1), 135 / 117 (B = 4), 143 / 102 (B = 16), 147 / 102 (B = 32); savings at 25 % = 3.8 / 13.8 / 28.4 / 30.4 %, so on
      L40S the rule would give B* = 16 (LLaVA: B* = 4).  At B = 1 the 8 decode steps (~190 ms) and vision (~58 ms, processor + tower) dominate;
      at B ≥ 16 right padding to the batch's largest image weighs on the 100 % row.  The rule is applied only to the reference measurement.
  readout_pre_registered:
    split: "CAL (primary); FIT descriptive; DEV sealed"
    tables: "the frozen D1-10 readout re-applied by scripts/r7_d1_40_analyze.py (imports the frozen r7_d1_analyze statistics unchanged): per mechanism × fraction mean h, d, h − d (balanced, image-cluster bootstrap 95 %, 2,000 reps), P(h < 0), P(h > d), Pearson / Spearman (h, d), masked accuracy, realised mean kept tokens; teacher quality (balanced Brier full with CI, text-only, accuracies, text-only residual); GQA structural strata"
    interpretation_grid: "the frozen D1-10 grid, with the coordinator's rank-criterion note (calibrated-teacher ceiling band, the 0.5 line reported as superseded) and the 2026-10-12 clarification that the band is a reference under the teacher's own probabilities, not an upper bound"
    yes_no_mass: "frozen coordinator note re-applied: primary keeps every item (p̃ renormalised over yes / no), the pre-declared secondary repeats the CAL table without items whose full-pass mass < 0.9, excluded counts per role; NEW descriptive QC: low-mass counts by GQA structural / semantic type (Qwen answers some 'either X or Y' questions with an object word); the frozen FIT-only tool scripts/r7_d1_massqc.py reads the Qwen records unchanged"
    identity_check: "max |h − d − 2(C − b)(b − a)| ≤ 1e-12"
    analyser: "refuses partial coverage; DEV only with --allow-dev (R7-40c)"
  units: "stage 0: 1 launch-probe GPU job; stage 1: 12 bundle jobs (b000–b011; 4 shards of 250 images ≈ 4,000 questions each); stage 2: completeness + CAL readout (2 CPU jobs)"
  cost: >
    Measured on L40S (smokes 1035606 / 1035635): 0.283 s per question batched (0.486 at batch 1), weight staging + load 381 s per job, peak 18.3 GB
    (worst cases: tower on 16 images of 1,225 tokens 18.9 GB, a 16,384-token prefill batch 17.7 GB; fits all three GPU types).  47,949 questions:
