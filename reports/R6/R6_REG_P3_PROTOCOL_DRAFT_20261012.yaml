      field/0029 (0, −4) 0.267 → 0.348; field/0039 (0, 2) 0.278 → 0.295; field/0040 (1, 2) 0.207 → 0.244;
      field/0045 (0, 2) 0.298 → 0.336; field/0054 (−1, 2) 0.187 → 0.206; forest/0054 (−1, −3) 0.272 → 0.305;
      mountain/0028 (1, −4) 0.214 → 0.249; mountain/0030 (1, −2) 0.497 → 0.544; mountain/0051 (−1, −3) 0.502 → 0.595;
      mountain/0053 (1, −2) 0.507 → 0.567; oldbuilding/0085 (1, −2) 0.333 → 0.550; oldbuilding/0101 (−3, 2) 0.399 → 0.450;
      street/0016 (0, −2) 0.408 → 0.469; street/0028 (0, −2) 0.478 → 0.569; street/0050 (−1, 3) 0.365 → 0.468;
      street/0051 (−1, −2) 0.506 → 0.566; street/0052 (−2, −1) 0.378 → 0.518; street/0054 (2, 0) 0.346 → 0.415;
      water/0009 (0, 6) 0.172 → 0.275; water/0024 (−1, −2) 0.512 → 0.556; water/0043 (0, 4) 0.193 → 0.197;
      water/0045 (−3, 1) 0.234 → 0.396; water/0058 (2, −3) 0.325 → 0.350; water/0060 (0, 4) 0.306 → 0.321;
      water/0062 (0, 3) 0.453 → 0.506; water/0065 (−1, −2) 0.461 → 0.558; water/0083 (−1, −3) 0.522 → 0.528.
      Of all 477 pairs, 373 peak at (0, 0) and 444 within ±1
