# R6 REG-P3 — the REG-P2 rigid comparison on a second modality pair: EPFL RGB–NIR Scene (visible vs near-infrared photographs).  DRAFT v2
# 2026-10-12, written before any REG-P3 registration on a DEV window.  It contains the implementation, unit tests, the data audit, a full prepare
# check, and CPU / GPU smokes whose "DEV" is two relabelled CAL windows.  The coordinator's rules of 2026-10-12 are folded in (decisions_20261012).
# The Zurich Summer version (draft v1) is NOT run and is kept below as zurich_not_run.  Nothing is frozen and nothing of the pilot is launched.
protocol_id: R6-REG-P3
status: draft
route: REG (reports/R6/R6_ROUTE_DECISION.md); R6 synthesis §1 "what a stronger claim would need — a second modality pair"
go_ahead: owner standing authorization 2026-10-11 (useful experiments on free GPUs); freeze and launch by the coordinator
question: >
  On a second modality pair (visible RGB vs near-infrared photographs of natural and urban scenes, two separate exposures), does the REG-P1 /
  REG-P2 finding replicate?  That finding: learned local-relation critics (VCS, logistic, InfoNCE), trained on FIT and then frozen, give a rigid
  registration energy F_T(θ, t) = J(T; P_T, Q_T) that recovers known rigid transforms more reliably than per-image MI / NMI, the same-target kernel
  critic and CoMIR representations, all under REG-P2's shared optimiser.
zurich_not_run:
  status: "not run (coordinator, 2026-10-12): pan-sharpened bands share the panchromatic detail, so MI / NMI / kernel are at ceiling in the smokes (median 0.2–0.4 px); licence conflict CC BY vs CC BY-NC-ND noted"
  data: >
    Zurich Summer v1.0, Zenodo 5914759.  The zip's md5 c79a08ec… was verified.  20 GeoTIFF tiles, uint16, bands B, G, R, NIR,
    principal-component pansharpened, 0.6 m pixels, 622 × 782 to 1 639 × 1 672 px.  No official split.  Licence: the Zenodo record says
    CC BY 4.0; the README inside the archive says the images are DigitalGlobe property under CC BY-NC-ND 4.0.
    v1 design: 17 units (tiles merged when closer than 50 m); DEV 8 units / 38 windows, CAL 4 / 9, FIT 5 (6.5 Mpx); P2's family on 512-px windows
  comir_zurich_protocol: >
    The CoMIR repository (commit 1750b11) has no Zurich registration protocol.
    - train-zurich.ipynb trains on zh10 and logs a test loss on zh12 (lines 314–315).  Settings: 128-px crops, flips and ±180° rotation
      (294–296), 3 latent channels (110), τ 0.1 (136), Adam (192), 5 epochs × batch 24 (180–182), DN / 2¹² (257), RGB = channels 0–2 and
      NIR = 3 (114–119).  It then studies equivariance and stability on one zh12 patch (780–829).
    - The evaluation scripts are BF/SHG only (scripts/Evaluation_RegSIFT.m lines 57, 71; scripts/MI_registration/Evaluation_RegMI.m lines 70, 87).
    - competitors/pytorch-CycleGAN-and-pix2pix/commands.sh lines 13–35 use zurich_rotated / standard / whole folders that nothing in the
      repository generates
  smokes: "CPU smoke job 1035257 and GPU smoke job 1035258, both on 4 CAL windows (code checks): MI / NMI / kernel median 0.23–0.38 px, every registration < 2.25 px"
  code: "scripts/r6_reg_p3.py prepare --dataset zurich (kept for the record; pinned by tests ZurichDataFacts); not run"
data:
  source: >
    EPFL IVRL RGB–NIR Scene dataset (nirscene1).  Brown & Süsstrunk, "Multispectral SIFT for Scene Category Recognition", CVPR 2011.  Archive
    nirscene1.zip, sha256 7c465a23…f746bc, downloaded 2026-09-27 (PROVENANCE.json); per-file sha256 in the manifest
  path: /projects/EEG-foundation-model/yinghao/data/epfl_rgb_nir/nirscene1/<category>/<id>_rgb.tiff and <id>_nir.tiff (read only; untrusted download — read as bytes by REG-P1's strict TIFF reader, nothing executed)
  content: >
    477 scene pairs in 9 categories: country 52, field 51, forest 53, indoor 56, mountain 55, oldbuilding 51, street 50, urban 58, water 51.
    Uncompressed 8-bit TIFF: RGB with 3 channels, NIR with 1 channel; RGB and NIR shapes match in every pair.  The images are the authors'
    registered crops of the 1024 × 768 resized photographs: 1024 wide × 620–759 high, or 501–1023 wide × 768 high.  Each pair was taken as two
    separate exposures of a modified SLR camera.  The alignment truth is the authors' SIFT registration, so residual error and scene motion
    between the exposures are possible — hence the alignment check below
  licence: "no licence or terms text on the dataset page (re-checked 2026-10-11).  The owner accepted the source for internal research (P60, 2026-09-27); publication needs the owner's OK"
  official_split: "none — nothing to keep closed (official_test_access false); every kept pair is used in exactly one role"
  prior_internal_evidence: >
    P60 B-T2 (60 pairs; histogram MI / NMI vs a closed-form raw-pixel VCS energy; truth = the dataset registration).  MI succeeded
    0.95 / 0.89 / 0.71 / 0.50 at perturbation ranges R = 5 / 10 / 20 / 30, so MI fails more at larger translations.  This is why EPFL was chosen
    over the ceiling-bound Zurich data, and why REG-P2's translation strata are kept (disclosure)
  checks:   # code: scripts/r6_reg_p3.py alignment_check / misaligned / near_duplicate_links — the data audit's computation ported verbatim; the full prepare check (job 1035339) reproduced the audit's lists exactly
    alignment_rule: >
      Gradient magnitudes of the RGB luminance (0.299 R + 0.587 G + 0.114 B) and of the NIR are taken at half resolution (2 × 2 area mean).  For
      every integer shift (dy, dx) in [−6, 6]², the correlation of their z-scored interiors (8-px margin) is computed; the first maximum in scan
      order (dy outer, dx inner) is the best shift.  A pair is EXCLUDED when max(|dy|, |dx|) >= 2 half-resolution px, i.e. >= 4 native px.
      Excluded pairs are listed below (not silently dropped) and are never used in any role
    size_rule: "a pair whose image is narrower or lower than the 512-px window cannot hold the registration image and is excluded (forced by the geometry; listed)"
    near_duplicate_rule: >
      Within a category, two scenes are linked when their z-scored luminance thumbnails (half resolution ÷ 16) have the same shape and correlate
      > 0.9 (mean product).  Links are merged transitively into units, also through excluded scenes, so linked kept scenes stay together
